name: 가격 갱신

on:
  schedule:
    - cron: "0 1 * * *"   # 매일 KST 10:00. 새 데이터가 있을 때만 커밋한다
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: 가격 받아오기
        run: node update-prices.mjs
      - name: 바뀐 게 있으면 커밋
        run: |
          if git diff --quiet -- prices.json; then
            echo "새 데이터 없음"
            exit 0
          fi
          git config user.name "time-price-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add prices.json
          git commit -m "가격 갱신 $(date -u +%F)"
          git push
