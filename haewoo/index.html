<style>
/* 해우소: 휴게소 공중화장실 × 절 (연등·목탁). 홀 = 칸 4개 + 타일 바닥, 칸 안 = 근심 적는 종이 + 물 내리기 */
:root {

  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--body); overflow: hidden; touch-action: manipulation; -webkit-user-select: none; user-select: none; }
.stage { position: fixed; inset: 0; display: flex; justify-content: center; }
canvas { display: block; height: 100%; max-width: 100%; cursor: pointer; }

  position: fixed; left: 0; right: 0; bottom: 0; display: flex; justify-content: center; pointer-events: none;
  padding: 0 max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.row { width: 100%; max-width: 448px; display: flex; gap: 8px; justify-content: center; }
button { font: 700 15px/1 var(--body); border: 0; border-radius: 999px; padding: 13px 20px; cursor: pointer; pointer-events: auto; }
button[hidden] { display: none; }
.go { background: var(--green); color: #fff; box-shadow: 0 6px 18px rgba(47,110,79,.4); }
.chip { background: var(--chip); color: var(--chip-ink); }
a.chip { pointer-events: auto; font: 700 15px/1 var(--body); border-radius: 999px; padding: 13px 16px; text-decoration: none; display: inline-flex; align-items: center; }
a.chip[hidden] { display: none; }
button:focus-visible, textarea:focus-visible { outline: 2px solid #f0b429; outline-offset: 2px; }
button:active { transform: scale(.96); }

/* 칸 안 */
.inside { position: fixed; inset: 0; display: flex; justify-content: center; align-items: flex-start; pointer-events: none;
  padding: calc(16px + env(safe-area-inset-top, 0px)) 16px 0; }
.inside[hidden] { display: none; }
.paper { pointer-events: auto; width: 100%; max-width: 400px; background: var(--paper); border-radius: 6px 6px 14px 14px; padding: 16px 16px 14px;
  box-shadow: 0 10px 30px rgba(0,0,0,.25); background-image: repeating-linear-gradient(transparent 0 27px, #eadfc8 27px 28px); }
.paper h1 { font: 34px/1 var(--hand); margin: 0 0 2px; }
.paper .note { font-size: 12px; color: #6b6355; margin: 0 0 10px; }
textarea { width: 100%; height: 84px; resize: none; border: 1.5px solid #d9ccb0; border-radius: 10px; background: rgba(255,255,255,.7); padding: 10px 12px;
  font: 25px/1.25 var(--hand); color: var(--ink); -webkit-user-select: text; user-select: text; }
.cards { display: flex; flex-wrap: wrap; gap: 6px; margin: 10px 0 12px; }
.cards button { font: 500 13px/1.25 var(--body); padding: 8px 11px; background: #f3ead6; color: #4a3f2e; border-radius: 10px; text-align: left; }
.cards button.on { background: #2f6e4f; color: #fff; }
.cards .more { background: transparent; color: #8a7a5c; text-decoration: underline; padding: 8px 6px; }
.acts { display: flex; gap: 8px; justify-content: space-between; }
.acts .flush { background: #8a5a35; color: #fff; flex: 1; box-shadow: 0 6px 16px rgba(138,90,53,.35); }
.acts .out { background: #e9e2d2; color: #4a3f2e; }

/* 오늘의 화두 */
.hwadu { pointer-events: auto; width: 100%; max-width: 400px; margin-top: 18vh; background: #fffdf6; border-radius: 16px; padding: 22px 20px 18px; text-align: center;
  box-shadow: 0 10px 30px rgba(0,0,0,.3); border-top: 8px solid var(--red); }
.hwadu[hidden] { display: none; }
.hwadu small { display: block; font: 700 12px var(--body); color: var(--red); letter-spacing: .08em; }
.hwadu p { font: 26px/1.4 var(--brush); margin: 10px 0 8px; }

.hwadu a.call { display: block; margin: 0 0 10px; padding: 13px; border-radius: 999px; background: var(--red); color: #fff; font: 700 15px var(--body); text-decoration: none; }

.toast { position: fixed; left: 50%; top: calc(16% + env(safe-area-inset-top, 0px)); transform: translateX(-50%); width: max-content; max-width: calc(100% - 32px);
  background: var(--chip); color: var(--chip-ink); border-radius: 14px; padding: 12px 18px; font: 700 15px/1.45 var(--body); text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s; }
.toast.on { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }

<script>
(() => {
  // ---------- 근심 카드 (공유되는 건 이 문장뿐) · 오늘의 화두 ----------
  const CARDS = [
    "엄마한테 괜찮다고 거짓말했어요", "월요일이 또 와요", "카드값이 월급보다 먼저 와요", "단톡방 답장을 3일째 미루고 있어요",
    "다이어트는 내일부터예요", "부장님 농담에 억지로 웃었어요", "퇴사 각을 매일 재고 있어요", "친구 결혼식 축의금이 부담돼요",
    "운동 등록만 하고 안 갔어요", "새벽 2시까지 쇼츠를 봤어요", "읽씹하고 미안해하는 중이에요", "통장이 스쳐 지나가요",
    "집값 보면 한숨만 나와요", "회의 중에 딴생각했어요", "아이한테 소리 질러서 미안해요", "부모님께 전화를 못 드렸어요",
    "연락 끊긴 친구가 생각나요", "전 애인 SNS를 몰래 봤어요", "장바구니 앞에서 고민 중이에요", "할 일을 미루고 이걸 보고 있어요",
    "주식이 파랗게 질렸어요", "이직하고 싶은데 용기가 안 나요", "오늘도 야근이에요", "점심 메뉴 고르는 게 제일 어려워요",

    "내일 발표가 걱정돼요", "이번 달도 저축을 못 했어요", "집안일이 끝이 없어요", "잠이 안 와요",
    "사과할 타이밍을 놓쳤어요", "거절을 못 해서 또 떠안았어요", "열심히 하는데 아무도 몰라요", "반려동물 병원비가 걱정돼요",
    "허리가 아파요", "건강검진 결과를 아직 안 열어 봤어요", "형제랑 또 다퉜어요", "명절이 벌써 걱정돼요",
    "회사 볼펜을 집에 가져왔어요", "상사 메일에 '넵'만 열 번 썼어요", "출근길에 울 뻔했어요", "아무것도 안 하고 하루가 갔어요",
    "운동화 끈만 묶고 다시 누웠어요", "대출 이자가 또 올랐어요", "내가 한 말이 계속 마음에 걸려요", "고맙다는 말을 못 했어요",
    "연말정산이 벌써 무서워요", "친구 생일을 깜빡했어요", "혼자인 게 가끔 외로워요", "SNS 보고 또 비교했어요",
    "택배를 또 시켰어요", "아이 숙제를 대신 해 줬어요", "거울 보기 싫은 날이에요", "계획만 세우고 시작을 못 해요",
    "휴가를 못 쓰고 있어요", "괜히 짜증을 냈어요", "그냥, 다 귀찮아요", "오늘 하루가 너무 길었어요"
  ];
  const HWADU = [
    "단톡방 하나 조용히 나가기", "물 두 잔 마시기", "오늘은 계단 한 층만", "미뤄 둔 답장 하나 보내기", "엄마한테 이모티콘 하나",
    "휴대폰 엎어 두고 5분 멍", "퇴근길에 하늘 한 번 보기", "고맙다는 말 한 번 하기", "할 일 하나만 지우기", "장바구니 하나 비우기",
    "어깨 세 번 돌리기", "좋아하는 노래 한 곡 끝까지", "저녁은 따뜻한 걸로", "알림 하나 끄기", "창문 열고 숨 세 번",
    "내일의 나에게 메모 한 줄", "오늘 잘한 일 하나 떠올리기", "사진첩에서 웃긴 사진 하나", "현관 신발 정리하기", "오늘은 11시 전에 눕기",
    "걱정은 내일 오후 3시로 미루기", "칭찬 하나 먼저 하기", "책상 위 물건 세 개 치우기", "오랜 친구에게 안부 한 줄", "햇볕 5분 쬐기",
    "커피 대신 물 한 잔", "오늘은 0원 쓰는 시간 만들기", "웃긴 영상 딱 하나만 보고 끄기", "이불 개기", "아무것도 안 하기 10분"
  ];
  const SLOGANS = ["근심은 변기에, 마음은 가볍게", "한 걸음 앞으로, 근심 한 줄 뒤로", "머문 자리에 근심은 두고 가세요", "물 내리기 전에 한 번 더 털어 주세요"];
  // 위기 표현: 글은 서버로 안 가고, 폰 안에서만 보고 109를 안내한다
  const CRISIS = /죽고\s*싶|죽을\s*래|자살|자해|사라지고\s*싶|살기\s*싫|목숨|극단적|뛰어내리|끝내고\s*싶/;

  // ---------- 캔버스 ----------
  const W = 360; let H = 640;
  const cv = document.getElementById("cv"), g = cv.getContext("2d");
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = Math.min(window.innerWidth, 520), vh = window.innerHeight;
    H = Math.max(640, Math.min(900, Math.round(W * vh / vw)));
    const sc = Math.min(vw / W, vh / H), cw = Math.round(W * sc), ch = Math.round(H * sc);
    cv.style.width = cw + "px"; cv.style.height = ch + "px";
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  addEventListener("resize", fit); fit();
  function rr(x, y, w, h, r) { g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r); g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath(); }
  const $ = id => document.getElementById(id);
  const comma = n => Math.round(n).toLocaleString("ko-KR");
  let toastTimer = 0;
  function toast(html, ms = 2600) { const t = $("toast"); t.innerHTML = html; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), ms); }

  // ---------- 배치 ----------
  const N = 4, SX = 16, SW = (W - 32) / N, RAIL = 112, DOOR_T = 122, DOOR_B = 298, FLOOR = 300;
  const cx = i => SX + SW * i + SW / 2;
  const Y_TOP = 330, yBot = () => H - 120;
  const SKIN = ["#f1c9a5", "#e5b48a", "#c98e64", "#f6d6bb", "#d9a274", "#b97c55"];
  const SHIRT = ["#3b6fb6", "#d65a4a", "#4f8f5b", "#7a5bb0", "#e0a43a", "#2f3a46"];
  const HAIR = ["#1d1a17", "#3a2a1e", "#5b3a24", "#222", "#6b4a2f", "#141414"];

  // 배경 손님: 모두에게 같은 시각표로 칸을 쓰고 나간다 (실제 접속자와 별개, 카운터에는 안 들어감)
  function npc(i, ms) {
    const P = 64 + i * 19, s = ms / 1000 + i * 37, ph = (s % P) / P;
    // 칸이 끝나갈 즈음엔 다음 손님이 노란 선 뒤에서 기다린다
    return { busy: ph < 0.45, flushing: ph >= 0.45 && ph < 0.53, left: (0.45 - ph) * P, waiting: ph > 0.22 && ph < 0.45 };
  }

  // ---------- 나와 다른 사람 ----------
  let look = Math.floor(Math.random() * 6);
  try { const v = Number(localStorage.getItem("haewoo-look")); if (Number.isInteger(v) && v >= 0 && v < 6 && localStorage.getItem("haewoo-look") !== null) look = v; else localStorage.setItem("haewoo-look", String(look)); } catch (e) {}
  const me = { x: 60 + Math.random() * 240, y: 0, tx: 0, ty: 0, st: "free", s: -1 };
  me.y = Y_TOP + 40 + Math.random() * 120; me.tx = me.x; me.ty = me.y;
  const others = new Map();
  let total = 0, count = 0, online = false;
  let mine = { day: new Date().toDateString(), n: 0 }; // 오늘 내가 내려보낸 수 (이 기기에만)
  try { const v = JSON.parse(localStorage.getItem("haewoo-mine") || "null"); if (v && v.day === mine.day && v.n > 0) mine.n = v.n | 0; } catch (e) {}

  function realIn(i) { for (const o of others.values()) if (o.st === 2 && o.s === i) return true; return false; }
  function occupied(i, ms) { return npc(i, ms).busy || realIn(i) || (me.st === "in" && me.s === i); }

  // ---------- 그리기: 홀 ----------
  let sloganI = 0, sloganT = 0;
  const smokes = [];   // 지붕 위로 떠오르는 근심 카드
  function drawHall(now, t, dt) {
    // 천장 + 형광등 (하나는 깜빡)
    g.fillStyle = "#eef2f3"; g.fillRect(0, 0, W, 70);
    const flick = Math.sin(t / 53) > 0.93 || Math.sin(t / 211) > 0.985 ? 0.35 : 1;
    g.fillStyle = "#ffffff"; g.globalAlpha = 1; g.fillRect(40, 62, 90, 5); g.globalAlpha = flick; g.fillRect(230, 62, 90, 5); g.globalAlpha = 1;
    // 오늘 카운터 (LED)
    g.fillStyle = "#0b0d0f"; rr(14, 10, W - 28, 42, 6); g.fill();
    g.fillStyle = "#ff5a44"; g.font = '16px "Do Hyeon", sans-serif'; g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText(`오늘 내려간 근심 ${comma(count)}개`, 26, 31);
    g.fillStyle = "#6dff8f"; g.textAlign = "right"; g.font = '600 12px "Do Hyeon", sans-serif';
    g.fillText(online ? `접속 ${total}명` : "", W - 26, 31); g.textAlign = "left";
    // 벽 타일
    g.fillStyle = "#dfe9e6"; g.fillRect(0, 70, W, FLOOR - 70);
    g.strokeStyle = "#c6d4d0"; g.lineWidth = 1;
    for (let y = 70; y < FLOOR; y += 16) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    for (let x = 8; x < W; x += 16) { g.beginPath(); g.moveTo(x, 70); g.lineTo(x, RAIL); g.stroke(); }
    // 표어
    sloganT += dt; if (sloganT > 9000) { sloganT = 0; sloganI = (sloganI + 1) % SLOGANS.length; }
    g.font = '13px "Do Hyeon", sans-serif'; g.textAlign = "center";
    const sl = SLOGANS[sloganI], sw = g.measureText(sl).width + 26;
    g.fillStyle = "#2f6e4f"; rr(W / 2 - sw / 2, 78, sw, 24, 4); g.fill();
    g.fillStyle = "#fff"; g.fillText(sl, W / 2, 90.5);
    // 연등 (흔들흔들)
    for (const [lx, ph] of [[26, 0], [W - 26, 1.7]]) {
      const sway = Math.sin(t / 900 + ph) * 0.12;
      g.save(); g.translate(lx, 70); g.rotate(sway);
      g.strokeStyle = "#7a1e16"; g.lineWidth = 1; g.beginPath(); g.moveTo(0, 0); g.lineTo(0, 10); g.stroke();
      g.fillStyle = "#c8372b"; g.beginPath(); g.ellipse(0, 22, 11, 13, 0, 0, Math.PI * 2); g.fill();
      g.strokeStyle = "rgba(255,255,255,.35)"; g.beginPath(); g.ellipse(0, 22, 5, 13, 0, 0, Math.PI * 2); g.stroke();
      g.fillStyle = "#f0c43a"; g.fillRect(-4, 34, 8, 4); g.fillRect(-1, 38, 2, 6);
      g.restore();
    }
    // 칸

  // ---------- 조작 ----------
  // 어디서 왔는지에 따라 돌아가는 버튼 이름 (내시간역은 시각에 맞는 장소로 열린다)
  const FROM = { roof: "← 옥상으로", station: "← 승강장으로", sauna: "← 찜질방으로" }[new URLSearchParams(location.search).get("from")] || "← 내시간역";
  $("back").textContent = FROM;
  function pickStall(now) {
    // 지금 빈 칸 중 가까운 곳, 없으면 배경 손님이 제일 먼저 나오는 칸
    let best = -1, bd = 1e9;
    for (let i = 0; i < N; i++) if (!occupied(i, now)) { const d = Math.abs(cx(i) - me.x); if (d < bd) { bd = d; best = i; } }
    if (best >= 0) return best;
    let soon = 0, sl = 1e9;
    for (let i = 0; i < N; i++) { if (realIn(i)) continue; const l = npc(i, now).left; if (l < sl) { sl = l; soon = i; } }
    return soon;
  }
  function goStall(i) { me.s = i; me.st = "go"; me.tx = cx(i); me.ty = Y_TOP - 4; send(); }
  cv.addEventListener("pointerdown", e => {
    if (me.st === "in") return;
    const r = cv.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * W, vy = (e.clientY - r.top) / r.height * H;
    if (vy > DOOR_T && vy < FLOOR + 10 && vx > SX && vx < SX + SW * N) { goStall(Math.min(N - 1, Math.floor((vx - SX) / SW))); return; }
    if (vy < Y_TOP - 10) return;
    me.st = "free"; me.s = -1;
    me.tx = Math.min(W - 20, Math.max(20, vx)); me.ty = Math.min(yBot(), Math.max(Y_TOP, vy));
  });
  $("enter").addEventListener("click", () => {
    audio(); // iOS: 첫 터치에서 소리 준비
    if (me.st === "queue" || me.st === "go") { me.st = "free"; me.s = -1; me.ty = me.y + 30; send(); return; }
    goStall(pickStall(Date.now()));
  });

  // 칸 안
  let chosen = -1, shown = [];
  function dealCards() {
    const pool = CARDS.map((_, i) => i).filter(i => i !== chosen);
    shown = []; while (shown.length < 4 && pool.length) shown.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
    const box = $("cards"); box.innerHTML = "";
    for (const i of shown) {
      const b = document.createElement("button"); b.type = "button"; b.textContent = CARDS[i];
      if (i === chosen) b.classList.add("on");
      b.addEventListener("click", () => { chosen = i; $("worry").value = CARDS[i]; [...box.children].forEach(c => c.classList.toggle("on", c === b)); });
      box.appendChild(b);
    }
    const more = document.createElement("button"); more.type = "button"; more.className = "more"; more.textContent = "다른 근심 보기";
    more.addEventListener("click", dealCards); box.appendChild(more);
  }
  $("worry").addEventListener("input", () => { if (chosen >= 0 && $("worry").value !== CARDS[chosen]) { chosen = -1; [...$("cards").children].forEach(c => c.classList.remove("on")); } });
  function enterStall() {
    me.st = "in"; send();
    $("inside").hidden = false; $("paper").hidden = false; $("hwadu").hidden = true;
    $("worry").value = ""; chosen = -1; dealCards(); flushT0 = -1;
    $("enter").hidden = true; $("back").hidden = true;
  }
  function leaveStall() {
    me.st = "free"; me.x = cx(me.s); me.y = Y_TOP + 6; me.tx = me.x; me.ty = Y_TOP + 50 + Math.random() * 60; me.s = -1;
    $("inside").hidden = true; $("enter").hidden = false; $("back").hidden = false; flushT0 = -1; send();
  }
  $("leave").addEventListener("click", leaveStall);
  $("save").addEventListener("click", () => { saveTalisman().catch(() => toast("저장에 실패했어요", 1600)); });
  $("done").addEventListener("click", () => {
    const text = flushText;
    leaveStall();
    // 내 근심 카드도 내 화면에선 바로 떠오른다 (서버는 남에게만 보낸다)
    smokes.push({ text: chosen >= 0 ? `'${CARDS[chosen]}'` : "근심 하나", x: me.x, t0: performance.now() });
  });
  $("flush").addEventListener("click", () => {
    if (flushT0 >= 0) return;
    const text = $("worry").value.trim();
    flushText = text || "그냥 다 귀찮음";
    const crisis = CRISIS.test(text);
    knock(); setTimeout(knock, 160); whoosh();
    try { navigator.vibrate && navigator.vibrate([25, 40, 60, 40, 140]); } catch (e) {} // 안드로이드만 (아이폰 웹은 진동 없음)
    $("paper").hidden = true; $("worry").blur();
    flushT0 = performance.now();
    // 서버에는 카드 번호만 (자유 글은 보내지 않는다)
    if (ws && ws.readyState === 1) ws.send(JSON.stringify({ t: "flush", k: chosen, s: me.s }));
    else count++;
    mine.n++; try { localStorage.setItem("haewoo-mine", JSON.stringify(mine)); } catch (e) {}
    setTimeout(() => {
      $("hwadu").hidden = false;
      if (crisis) {
        $("hwTag").textContent = "잠깐만요";
        $("hwText").textContent = "많이 힘드셨죠. 혼자 견디지 않아도 돼요.";
        $("hwCall").hidden = false; $("save").hidden = true;
        $("hwSub").textContent = "자살예방상담전화 109 · 24시간 · 비밀 보장";
      } else {
        $("hwTag").textContent = "오늘의 화두";
        $("hwText").textContent = HWADU[Math.floor(Math.random() * HWADU.length)];
        $("hwCall").hidden = true; $("save").hidden = false;
        $("hwSub").textContent = mine.n > 1 ? `오늘 내가 내려보낸 근심 ${mine.n}개` : "근심 하나 내려보냈어요";
      }
    }, 2300);
  });

  // ---------- 반복 ----------
  let last = performance.now();
  function step(t) {
    const dt = Math.min(64, t - last); last = t;
    const now = Date.now();
    if (me.st === "in") { drawInside(t); return; }
    drawHall(now, t, dt);
    // 걷기
    let walking = false;
    const dx = me.tx - me.x, dy = me.ty - me.y, dist = Math.hypot(dx, dy);
    if (dist > 1) { const sp = Math.min(dist, dt * 0.09); me.x += dx / dist * sp; me.y += dy / dist * sp; walking = true; }
    if (me.st === "go" && !walking) me.st = "queue";
    if (me.st === "queue") {
      me.tx = cx(me.s); me.ty = Y_TOP - 4;
      if (!walking && !occupied(me.s, now)) enterStall();
    }
    // 사람들 (앞뒤 순서)
    const items = [];
    for (let i = 0; i < N; i++) if (npc(i, now).waiting && !(me.s === i && me.st === "queue")) { const wy = Y_TOP + 6; items.push({ y: wy, f: () => drawWaiter(cx(i) + 6, wy, i + 1, t) }); }
    for (const [id, o] of others) {
      if (o.st === 2) continue; // 칸 안에 있는 사람 (문 아래 신발만 보임)
      o.dx += (o.x - o.dx) * Math.min(1, dt / 250); o.dy += (o.d - o.dy) * Math.min(1, dt / 250);
      const y = Y_TOP + o.dy * (yBot() - Y_TOP);
      items.push({ y, f: () => drawGuy(o.dx * W, y, o.lk, false, Math.abs(o.x - o.dx) > 0.004, t, 1) });
    }
    items.push({ y: me.y, f: () => drawGuy(me.x, me.y, look, true, walking, t, 1) });
    items.sort((a, b) => a.y - b.y); for (const it of items) it.f();
    drawSmokes(t);
    // 버튼
    const b = $("enter"), bt = me.st === "queue" ? (walking ? "가는 중 · 그만" : "기다리는 중 · 그만") : me.st === "go" ? "가는 중 · 그만" : "빈 칸에 들어가기";
    if (b.textContent !== bt) b.textContent = bt;
    if (t - lastSentT > (walking ? 150 : 5000)) { send(); lastSentT = t; }
  }
  let errShown = -1e9;
  function frame(t) {
    try { step(t); } catch (e) { console.error(e); fit(); if (t - errShown > 4000) { errShown = t; toast("화면 오류: " + String(e && e.message || e).slice(0, 80), 3500); } }
    requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.load) Promise.all([document.fonts.load('16px "Do Hyeon"', "오늘 내려간 근심개쏴아사용중비었음근심은변기에마음가볍게미끄럼주의"), document.fonts.load('22px "Nanum Pen Script"', "다 지나간다"), document.fonts.load('13px "Gowun Dodum"', "누군가 내려보낸 근심")]).catch(() => {});
  toast("해우소 · 근심 푸는 곳<br>빈 칸에 들어가 근심 적고 물 내려요", 3600);
  requestAnimationFrame(frame);
})();
</script>
