<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내 시간의 가격</title>
<meta name="description" content="평일 낮엔 회사 옥상, 퇴근길엔 지하철역, 밤과 주말엔 찜질방. 같은 시간에 접속한 사람들과 말없이 같이 있는 곳.">
<meta property="og:title" content="내 시간의 가격 — 옥상·지하철·찜질방">
<meta property="og:description" content="시간 따라 장소가 바뀌어요. 지금 접속한 사람들과 같이 농땡이·퇴근·드러눕기.">
<meta name="theme-color" content="#11161c">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Do+Hyeon&family=Gowun+Dodum&family=Nanum+Gothic+Coding:wght@400;700&display=swap">
<style>
/* 레이아웃: 한 화면 꽉 찬 승강장 캔버스(가상 360x640, 레터박스) + 아래 떠 있는 버튼 두 개. 서울 지하철 승강장(스크린도어·LED 안내판·녹색 역명판) */
:root {
  --night: #11161c;      /* 천장·레터박스 */
  --led: #ff9a2e;        /* LED 안내판 글자 */
  --tile: #dfe8e4;       /* 벽 타일 */
  --line: #2fa35a;       /* 역명판·열차 띠 */
  --floor: #a9adb0;      /* 승강장 바닥 */
  --ink: #1b2329;
  --chip: rgba(17, 22, 28, .86);
  --chip-ink: #f2f5f7;
  --go: #2fa35a;
  --display: "Do Hyeon", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "Gowun Dodum", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "Nanum Gothic Coding", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--chip-ink);
  font-family: var(--body); overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.stage { position: fixed; inset: 0; display: flex; justify-content: center; }
canvas { display: block; height: 100%; max-width: 100%; cursor: pointer; }
.hud {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.bar { width: 100%; max-width: 448px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 6px; justify-content: space-between; align-items: center; }
.chip, .go {
  pointer-events: auto; border: 0; cursor: pointer;
  font: 700 15px/1 var(--body); border-radius: 999px; padding: 12px 14px;
}
.chip[hidden] { display: none; }
.chip { background: var(--chip); color: var(--chip-ink); display: inline-flex; gap: 6px; align-items: baseline; }
.chip b { font: 600 16px var(--mono); color: var(--led); }
.go { background: var(--go); color: #fff; padding: 12px 22px; box-shadow: 0 6px 18px rgba(47,163,90,.45); }
.go[hidden] { display: none; }
.sigh { padding: 12px 14px; color: #c9d3db; }
.sigh:active { transform: scale(.94); }
.row .go { margin-left: auto; }
.chip:focus-visible, .go:focus-visible, input:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
.dial {
  pointer-events: auto; background: var(--chip); border-radius: 16px; padding: 12px 16px 10px;
  display: flex; flex-direction: column; gap: 4px;
}
.dial[hidden] { display: none; }
.dial .top { display: flex; justify-content: space-between; font-size: 13px; color: #b9c3cb; }
.dial .top b { font: 600 15px var(--mono); color: var(--chip-ink); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #4a5560; border-radius: 2px; }
input[type=range]::-moz-range-track { height: 4px; background: #4a5560; border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -11px; border-radius: 50%; background: var(--led); border: 3px solid var(--night); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--led); border: 3px solid var(--night); }
.toast {
  position: fixed; left: 50%; top: calc(18% + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--chip); color: var(--chip-ink); border-radius: 14px; padding: 12px 18px;
  font: 700 15px var(--body); text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s;
  max-width: calc(100% - 32px); width: max-content;
}
.toast.on { opacity: 1; }
.toast b { color: var(--led); font-family: var(--mono); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="stage"><canvas id="cv" aria-label="퇴근길 지하철 승강장. 화면을 누르면 내 캐릭터가 그 자리로 걸어가요."></canvas></div>

<div class="hud">
  <div class="bar">
    <div class="dial" id="dial" hidden>
      <div class="top"><span>월급 (세전)</span><b id="payText">2,156,880원</b></div>
      <input type="range" id="pay" min="1000000" max="10000000" step="10000" value="2156880" aria-label="월급, 세금 떼기 전">
    </div>
    <div class="row">
      <button class="chip" id="me" type="button" aria-expanded="false" aria-controls="dial">내 1분 <b id="perMin">172원</b></button>
      <button class="chip sigh" id="sigh" type="button" aria-label="한숨 쉬기 (여러 번 누르면 영혼 가출, 더 누르면 사직서)">하아…</button>
      <button class="chip sigh" id="deco" type="button" hidden aria-label="옆에 둘 소품 바꾸기">소품</button>
      <button class="go" id="board" type="button" hidden>타기</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- 숫자 ----------
  const MIN_WAGE = 10320, MONTH_H = 209, MIN_MONTH = MIN_WAGE * MONTH_H, DAY_H = 8;
  let ITEMS = [
    { name: "아메리카노", price: 4700 }, { name: "짜장면", price: 7808 }, { name: "치킨", price: 23000 },
    { name: "넷플릭스 한 달", price: 13500 }, { name: "축의금", price: 117000 }, { name: "아이폰 18 프로", price: 1990000 },
    { name: "쏘나타", price: 28760000 }, { name: "서울 아파트", price: 1639190000 }
  ];
  const KEY = "zoopan-station-v1";
  let pay = MIN_MONTH;
  let look = Math.floor(Math.random() * 6);
  let myColor = 0, myProp = { roof: 1, sauna: 1, station: 0 };
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (s.pay >= 1000000 && s.pay <= 10000000) pay = s.pay;
    if (Number.isInteger(s.look)) look = s.look % 6;
    if (Number.isInteger(s.c)) myColor = Math.abs(s.c) % 6;
    if (Number.isInteger(s.pr)) myProp.roof = Math.abs(s.pr) % 6;
    if (Number.isInteger(s.ps)) myProp.sauna = Math.abs(s.ps) % 5;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ pay, look, c: myColor, pr: myProp.roof, ps: myProp.sauna })); } catch (e) {} };
  save();
  const hourly = () => pay / MONTH_H;
  const perMin = () => Math.round(hourly() / 60);
  const comma = n => Math.round(n).toLocaleString("ko-KR");
  function dur(price) {
    const min = Math.round(price / hourly() * 60);
    if (min < 60) return Math.max(1, min) + "분";
    if (min < DAY_H * 60) { const h = Math.floor(min / 60), m = min % 60; return h + "시간" + (m ? " " + m + "분" : ""); }
    const mon = MONTH_H * 60;
    if (min < mon) { let d = Math.floor(min / (DAY_H * 60)), h = Math.round((min % (DAY_H * 60)) / 60); if (h >= DAY_H) { d++; h = 0; } return d + "일" + (h ? " " + h + "시간" : ""); }
    const months = min / mon;
    if (months < 12) return (Math.round(months * 10) / 10) + "개월";
    let y = Math.floor(months / 12), mo = Math.round(months % 12); if (mo === 12) { y++; mo = 0; }
    return y + "년" + (mo ? " " + mo + "개월" : "");
  }

  // ---------- 캔버스 ----------
  const W = 360;
  let H = 640; // 화면이 세로로 길면 승강장 바닥을 아래로 늘린다
  const cv = document.getElementById("cv"), g = cv.getContext("2d");
  let scale = 1;
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = Math.min(window.innerWidth, 520), vh = window.innerHeight;
    H = Math.max(640, Math.min(900, Math.round(W * vh / vw)));
    scale = Math.min(vw / W, vh / H);
    const cw = Math.round(W * scale), ch = Math.round(H * scale);
    cv.style.width = cw + "px"; cv.style.height = ch + "px";
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  addEventListener("resize", fit); fit();

  const C = { night: "#11161c", led: "#ff9a2e", tile: "#dfe8e4", tile2: "#d2ddd8", line: "#2fa35a", floor: "#a9adb0", floor2: "#9a9ea2", ink: "#1b2329" };
  const SKIN = ["#f1c9a5", "#e5b48a", "#c98e64", "#f6d6bb", "#d9a274", "#b97c55"];
  const SHIRT = ["#3b6fb6", "#d65a4a", "#4f8f5b", "#7a5bb0", "#e0a43a", "#2f3a46"];
  const HAIR = ["#1d1a17", "#3a2a1e", "#5b3a24", "#222", "#6b4a2f", "#141414"];

  // 벽·열차·스크린도어는 K배로 줄여서 멀리 보이게 그린다 (그만큼 승강장 바닥이 넓어진다)
  const K = 0.64, BW = Math.round(W / K);          // 줄인 그림 안에서 쓰는 가로 폭
  const DOORS = [70, 180, 290, 400, 510];           // 줄인 그림 안 좌표
  const DOOR_SX = DOORS.map(d => d * K);            // 화면 좌표
  const PT = 86 + (426 - 86) * K;                   // 승강장 바닥이 시작하는 y

  // 시험용: 주소 끝에 ?at=18:30 을 붙이면 그 시각인 것처럼 돌아간다 (평소엔 폰 시각 그대로)
  const AT = (new URLSearchParams(location.search).get("at") || "").match(/^(\d{1,2}):(\d{2})$/);
  const T_OFF = AT ? (() => { const d = new Date(); d.setHours(+AT[1], +AT[2], 0, 0); return d.getTime() - Date.now(); })() : 0;
  const clock = () => Date.now() + T_OFF;

  // ---------- 장소: 시각에 따라 바뀐다 (평일 07~17 회사 옥상, 17~19 퇴근길 내시간역, 그 밖·주말 찜질방) ----------
  // 시험용: ?scene=roof|station|sauna
  const SCENES = ["roof", "station", "sauna"];
  const SCENE_NAME = { roof: "회사 옥상", station: "내시간역", sauna: "찜질방" };
  const SCENE_Q = new URLSearchParams(location.search).get("scene");
  const SCENE_FORCED = SCENES.includes(SCENE_Q);
  function sceneAt(ms) {
    if (SCENE_FORCED) return SCENE_Q;
    const d = new Date(ms), day = d.getDay(), h = d.getHours() + d.getMinutes() / 60;
    if (day === 0 || day === 6) return "sauna";
    if (h >= 17 && h < 19) return "station";
    if (h >= 7 && h < 17) return "roof";
    return "sauna";
  }
  function nextScene(ms) {
    if (SCENE_FORCED) return null;
    const cur = sceneAt(ms), d0 = new Date(ms); d0.setHours(0, 0, 0, 0);
    for (let k = 0; k < 5; k++) for (const h of [7, 17, 19]) {
      const t = new Date(d0); t.setDate(t.getDate() + k); t.setHours(h, 0, 0, 0);
      const tm = t.getTime();
      if (tm > ms && sceneAt(tm) !== cur) return { name: sceneAt(tm), at: tm };
    }
    return null;
  }

  // ---------- 열차 시간표: 실제 2호선 배차 간격에 가깝게, 폰 시각 기준 ----------
  // 모두가 같은 시각표를 계산하므로 서버 없이도 같은 열차를 함께 본다.
  // [시작초, 끝초, 배차초]  00:30~05:30 운행 없음
  const hm = (h, m = 0) => h * 3600 + m * 60;
  const BANDS_WEEKDAY = [[0, hm(0, 30), 600], [hm(5, 30), hm(6, 30), 600], [hm(6, 30), hm(7, 30), 240], [hm(7, 30), hm(9), 150],
    [hm(9), hm(17), 360], [hm(17), hm(18), 240], [hm(18), hm(19, 30), 150], [hm(19, 30), hm(20, 30), 240], [hm(20, 30), hm(23), 420], [hm(23), hm(24), 600]];
  const BANDS_WEEKEND = [[0, hm(0, 30), 600], [hm(5, 30), hm(7), 600], [hm(7), hm(21), 360], [hm(21), hm(24), 480]];
  const ARR = 4, OPEN_D = 10, CLOSE_D = 2, LEAVE_D = 4, WIN_END = OPEN_D + CLOSE_D + LEAVE_D; // 문 열림 기준 초
  const bandsFor = day => (day === 0 || day === 6) ? BANDS_WEEKEND : BANDS_WEEKDAY;
  const midnightOf = ms => { const d = new Date(ms); d.setHours(0, 0, 0, 0); return d.getTime(); };
  // epoch초 e 이후(포함) 첫 열차의 문 열림 epoch초
  function nextTrain(e) {
    for (let k = 0; k < 3; k++) {
      const m0 = midnightOf(e * 1000 + k * 86400000) / 1000;
      const s = Math.max(0, e - m0), bands = bandsFor(new Date(m0 * 1000).getDay());
      for (const [a, b, h] of bands) {
        if (s >= b) continue;
        const T = s <= a ? a : a + Math.ceil((s - a) / h) * h;
        if (T < b) return { e: m0 + T, h };
      }
    }
    return null;
  }
  function prevTrain(e) { // e 이전(포함) 마지막 열차
    for (let k = 0; k < 2; k++) {
      const m0 = midnightOf(e * 1000 - k * 86400000) / 1000;
      const s = Math.min(86399, e - m0), bands = bandsFor(new Date(m0 * 1000).getDay());
      for (let i = bands.length - 1; i >= 0; i--) {
        const [a, b, h] = bands[i];
        if (s < a) continue;
        const T = a + Math.floor((Math.min(s, b - 1) - a) / h) * h;
        return { e: m0 + T, h };
      }
    }
    return null;
  }
  function trainState(now) {
    const s = now / 1000;
    const cand = nextTrain(s - WIN_END);
    let x = null, door = 0, phase = "gone", id = 0, dt = 0, next = 0, after = null;
    if (cand && cand.e - ARR <= s) {
      id = cand.e; dt = s - id;
      if (dt < 0) { const k = (dt + ARR) / ARR; x = BW * Math.pow(1 - k, 3); phase = "arrive"; }
      else if (dt < OPEN_D) { x = 0; phase = "open"; door = Math.min(1, dt / 1.2); }
      else if (dt < OPEN_D + CLOSE_D) { x = 0; phase = "close"; door = Math.max(0, 1 - (dt - OPEN_D) / 1.2); }
      else { const k = (dt - OPEN_D - CLOSE_D) / LEAVE_D; x = -BW * k * k; phase = "leave"; }
      after = nextTrain(id + 1);
    } else {
      after = nextTrain(s);
      const p = prevTrain(s);
      id = p ? p.e : 0; // 마지막으로 떠난 열차
    }
    next = after ? after.e - s : 0;
    const night = phase === "gone" && next > 3600 && new Date(now).getHours() < 6;
    return { x, door, phase, id, dt, next, after, night };
  }
  const waitText = sec => sec < 60 ? Math.ceil(sec) + "초" : Math.floor(sec / 60) + "분 " + Math.floor(sec % 60) + "초";

  // ---------- 혼잡: 실제 시각 기준 (문마다 줄, 러시 땐 만원) ----------
  function crowdLevel(ms) {
    const d = new Date(ms), day = d.getDay(), h = d.getHours() + d.getMinutes() / 60;
    if (day === 0 || day === 6) return h >= 11 && h < 21 ? 0.3 : 0.1;
    if (h >= 18 && h < 19.5) return 1;
    if (h >= 7.5 && h < 9) return 0.85;
    if ((h >= 17 && h < 18) || (h >= 19.5 && h < 20.5) || (h >= 6.5 && h < 7.5)) return 0.55;
    if (h >= 9 && h < 17) return 0.25;
    if (h >= 20.5) return 0.18;
    return 0.06;
  }
  function crowdTitle(ms) {
    const d = new Date(ms), day = d.getDay(), h = d.getHours() + d.getMinutes() / 60, l = crowdLevel(ms);
    const tag = day > 0 && day < 6 && h >= 18 && h < 19.5 ? "퇴근 러시 · " : day > 0 && day < 6 && h >= 7.5 && h < 9 ? "출근 러시 · " : "";
    return tag + (l >= 0.85 ? "매우 혼잡" : l >= 0.5 ? "혼잡" : l >= 0.2 ? "보통" : "한산");
  }
  function plan(id) { // 열차 id(문 열림 epoch초)마다 문별 줄 길이·태울 수 있는 인원. 모두에게 같다.
    if (!id) return { q: DOORS.map(() => 0), cap: 99 };
    let s = (id * 2654435761) >>> 0;
    const r = () => { s ^= s << 13; s >>>= 0; s ^= s >>> 17; s ^= s << 5; s >>>= 0; return s / 4294967296; };
    const lvl = crowdLevel(id * 1000);
    const q = DOORS.map(() => Math.max(0, Math.round(lvl * 11 + (r() - 0.5) * 5 * lvl)));
    return { q, cap: lvl >= 0.85 ? 5 : lvl >= 0.5 ? 9 : 99 };
  }
  const boardedNow = (p, i, dt) => { const lim = Math.min(p.cap, p.q[i]); if (dt < 1) return 0; if (dt >= OPEN_D) return lim; return Math.min(lim, Math.floor((dt - 1) / 0.7) + 1); };
  const boardedFinal = (p, i) => Math.min(p.cap, p.q[i]);
  function visibleQueue(tr, i) { // 지금 문 i 앞에 서 있는 승객 수 (나 빼고)
    if (tr.phase !== "gone") { const p = plan(tr.id); return p.q[i] - boardedNow(p, i, tr.dt); }
    const pp = plan(tr.id), np = plan(tr.after ? tr.after.e : 0);
    const left = tr.id ? pp.q[i] - boardedFinal(pp, i) : 0;
    const gap = tr.after && tr.id ? (tr.after.e - ARR) - (tr.id + WIN_END) : 1;
    const k = Math.max(0, Math.min(1, 1 - (tr.next - ARR) / Math.max(1, gap)));
    return Math.round(left + (np.q[i] - left) * k);
  }
  const slotPos = (i, slot) => ({ x: DOOR_SX[i] + (slot % 2 ? 9 : -9), y: PT + 46 + Math.floor(slot / 2) * 16 });

  // ---------- 나와 다른 사람 ----------
  const me = { x: 0.3 + Math.random() * 0.4, tx: null, depth: Math.random(), st: "wait", walkT: 0 };
  me.tx = me.x;
  const others = new Map(); // peer -> {x, depth, p, look, st, dx}

  const FOOT_TOP = () => PT + 58, FOOT_RANGE = () => H - PT - 118;
  function depthY(d) { return FOOT_TOP() + d * FOOT_RANGE(); } // 발 위치 y (버튼 위까지)
  function depthS(d) { return 0.86 + d * 0.26; }    // 크기

  // label: 내 것은 "1분 172원", 남의 것은 월급 없이 "루팡 12분" 같은 머문 시간만
  // 꾸미기: 사원증 줄 색(옥상·역), 양머리 수건 색(찜질방), 옆에 두는 소품
  const LANYARD = ["#2fa35a", "#e0483a", "#2f7fd6", "#f0b429", "#8e5bd0", "#ff7aa8"];
  const TOWEL = ["#ffffff", "#ffc2d1", "#bfe3ff", "#ffe08a", "#c8f0c0", "#e2c8ff"];
  const PROPS = { roof: ["", "아이스 아메리카노", "맥주 한 캔", "옥상 고양이", "사직서 봉투", "노트북"], sauna: ["", "식혜", "바나나우유", "휴대폰 충전 중", "만화책"], station: [""] };
  const NPC_COAT = ["#4a525b", "#5b5048", "#3f4a56", "#55585e", "#47504a", "#5a4f57"];

  // o: { lk, label, isMe, walking, now, alpha, scene, pose("stand"|"lie"), c, p, k, npc }
  function drawPerson(x, d, o) {
    const { lk = 0, label = "", isMe = false, walking = false, now = 0, alpha = 1, scene = "station", pose = "stand", c = 0, p = 0, k = 0, npc = false } = o;
    const y = depthY(d), s = depthS(d), lie = pose === "lie", sauna = scene === "sauna";
    const bob = walking ? Math.abs(Math.sin(now / 110)) * 2.2 : lie ? 0 : Math.sin(now / 700 + x) * 0.8;
    g.save(); g.globalAlpha = alpha;
    if (sauna && k > 0) drawEggs(x + (lie ? -54 : -26) * s, y, s, Math.min(10, k));
    g.translate(x, y); g.scale(s, s);
    // 그림자
    g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(lie ? 4 : 0, 0, lie ? 44 : 15, 4, 0, 0, Math.PI * 2); g.fill();
    if (lie) { g.translate(37, -12); g.rotate(-Math.PI / 2); } // 머리가 왼쪽으로 가게 눕힌다
    // 다리
    const step = walking ? Math.sin(now / 110) * 4 : 0;
    g.strokeStyle = sauna && !npc ? "#f1c9a5" : "#2a2f36"; g.lineWidth = 5; g.lineCap = "round";
    if (sauna && !npc) g.strokeStyle = SKIN[(lk * 5 + 1) % 6];
    g.beginPath(); g.moveTo(-5, -20); g.lineTo(-5 + step, -2); g.moveTo(5, -20); g.lineTo(5 - step, -2); g.stroke();
    g.translate(0, -bob);
    if (npc) {
      g.fillStyle = sauna ? "#b9875a" : NPC_COAT[lk % 6]; roundRect(-12, -50, 24, 32, 9); g.fill();
    } else if (sauna) {
      // 찜질복: 주황 상의 + 반바지
      g.fillStyle = "#c96d2a"; roundRect(-11, -26, 22, 10, 4); g.fill();
      g.fillStyle = "#e9863e"; roundRect(-12, -50, 24, 28, 9); g.fill();
      g.strokeStyle = "rgba(255,255,255,.6)"; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(-5, -49); g.lineTo(0, -42); g.lineTo(5, -49); g.stroke();
    } else {
      g.fillStyle = SHIRT[lk % 6]; roundRect(-12, -50, 24, 32, 9); g.fill();
      // 사원증 줄
      g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 1.4;
      g.beginPath(); g.moveTo(-6, -49); g.lineTo(0, -34); g.lineTo(6, -49); g.stroke();
      g.fillStyle = "#fff"; g.fillRect(-3.5, -35, 7, 9);
      g.fillStyle = LANYARD[c % 6]; g.fillRect(-3.5, -35, 7, 2.5);
    }
    // 찜질방에서 누우면 수건을 덮는다
    if (lie && sauna) { g.fillStyle = npc ? "#e9e2d6" : TOWEL[c % 6]; roundRect(-14, -48, 28, 40, 6); g.fill(); g.strokeStyle = "rgba(0,0,0,.12)"; g.lineWidth = 1; g.stroke(); }
    // 머리
    g.fillStyle = npc ? "#c9a689" : SKIN[(lk * 5 + 1) % 6]; g.beginPath(); g.arc(0, -62, 12, 0, Math.PI * 2); g.fill();
    if (sauna) {
      // 양머리 수건
      const tc = npc ? "#efe9df" : TOWEL[c % 6];
      g.fillStyle = tc; g.strokeStyle = "rgba(0,0,0,.2)"; g.lineWidth = 1;
      g.beginPath(); g.arc(0, -63, 12.8, Math.PI, Math.PI * 2); g.closePath(); g.fill(); g.stroke();
      for (const sx of [-1, 1]) {
        g.beginPath(); g.arc(sx * 11, -67, 6.6, 0, Math.PI * 2); g.fill(); g.stroke();
        g.beginPath(); g.arc(sx * 11, -67, 3, 0, Math.PI * 2); g.stroke();
      }
    } else {
      g.fillStyle = npc ? "#26231f" : HAIR[lk % 6]; g.beginPath(); g.arc(0, -64, 12.4, Math.PI * 1.05, Math.PI * 1.95); g.fill();
      g.fillRect(-12.2, -66, 3, 6);
    }
    // 눈 (반달) + 찜질방은 발그레
    g.strokeStyle = "#222"; g.lineWidth = 1.6;
    g.beginPath(); g.arc(-4.5, -59.5, 2, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    g.beginPath(); g.arc(4.5, -59.5, 2, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    if (sauna && !npc) { g.fillStyle = "rgba(255,110,110,.35)"; g.beginPath(); g.arc(-7, -55, 2.6, 0, Math.PI * 2); g.arc(7, -55, 2.6, 0, Math.PI * 2); g.fill(); }
    g.restore();
    // 소품
    if (p) drawProp(scene, p, x + (lie ? 50 : 24) * s, y, s, now);
    // 누워 있으면 zZ
    if (lie && !npc) {
      g.save(); g.globalAlpha = alpha * 0.85; g.fillStyle = "#fff"; g.strokeStyle = "rgba(0,0,0,.35)"; g.lineWidth = 2.5;
      g.textAlign = "center"; g.textBaseline = "middle";
      for (let i = 0; i < 2; i++) {
        const ph = ((now / 1600) + i * 0.5) % 1;
        g.globalAlpha = alpha * Math.sin(ph * Math.PI) * 0.9;
        g.font = `700 ${(9 + i * 3) * s}px "Gowun Dodum", sans-serif`;
        const zx = x - 20 * s + ph * 10 * s, zy = y - (28 + ph * 22) * s;
        g.strokeText("z", zx, zy); g.fillText("z", zx, zy);
      }
      g.restore();
    }
    // 머리 위 표
    if (!label) return;
    g.save(); g.globalAlpha = alpha;
    g.font = `600 ${11 * s}px "Nanum Gothic Coding", monospace`;
    const tw = g.measureText(label).width, tx = (lie ? x - 25 * s : x) - tw / 2 - 6 * s, ty = y - (lie ? 50 : (sauna ? 96 : 88) + bob) * s;
    x = lie ? x - 25 * s : x;
    g.fillStyle = isMe ? C.led : "rgba(17,22,28,.82)";
    roundRect(tx, ty, tw + 12 * s, 17 * s, 8.5 * s); g.fill();
    g.fillStyle = isMe ? C.night : "#f2f5f7"; g.textBaseline = "middle"; g.textAlign = "center";
    g.fillText(label, x, ty + 8.8 * s);
    if (isMe) {
      g.fillStyle = C.led; g.beginPath(); g.moveTo(x - 4 * s, ty + 17 * s); g.lineTo(x + 4 * s, ty + 17 * s); g.lineTo(x, ty + 22 * s); g.fill();
    }
    g.restore();
  }
  // 줄 선 다른 승객(배경 인물). 실제 접속자와 헷갈리지 않게 가격표 없이 회색 실루엣으로만.
  const COAT = ["#4a525b", "#5b5048", "#3f4a56", "#55585e", "#47504a", "#5a4f57"];
  function drawNPC(x, y, seed, now) {
    const s = 0.78 + ((y - PT) / 400) * 0.25;
    const bob = Math.sin(now / 900 + seed) * 0.6;
    g.save(); g.translate(x, y); g.scale(s, s); g.globalAlpha = 0.9;
    g.fillStyle = "rgba(0,0,0,.14)"; g.beginPath(); g.ellipse(0, 0, 12, 3.5, 0, 0, Math.PI * 2); g.fill();
    g.strokeStyle = "#2c3036"; g.lineWidth = 4.5; g.lineCap = "round";
    g.beginPath(); g.moveTo(-4, -18); g.lineTo(-4, -2); g.moveTo(4, -18); g.lineTo(4, -2); g.stroke();
    g.translate(0, -bob);
    g.fillStyle = COAT[seed % 6]; roundRect(-11, -46, 22, 30, 8); g.fill();
    if (seed % 3 === 0) { g.fillStyle = "#2d2d2d"; roundRect(8, -40, 7, 12, 2); g.fill(); } // 가방
    g.fillStyle = "#c9a689"; g.beginPath(); g.arc(0, -56, 10, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#26231f"; g.beginPath(); g.arc(0, -58, 10.4, Math.PI * 1.05, Math.PI * 1.95); g.fill();
    if (seed % 2 === 0) { g.fillStyle = "#e9eef2"; g.fillRect(-3, -54, 6, 9); } // 휴대폰 보는 중
    g.restore();
  }

  // 찜질방: 누워 있던 시간만큼 쌓이는 맥반석 계란 (아래 4·3·2·1개 피라미드)
  function drawEggs(x, y, s, n) {
    let i = 0;
    for (let r = 0; r < 4 && i < n; r++) {
      const cnt = 4 - r;
      for (let j = 0; j < cnt && i < n; j++, i++) {
        const ex = x + (j - (cnt - 1) / 2) * 8.4 * s, ey = y - 5 * s - r * 8 * s;
        g.fillStyle = "#a8743f"; g.beginPath(); g.ellipse(ex, ey, 4.2 * s, 5.2 * s, 0, 0, Math.PI * 2); g.fill();
        g.fillStyle = "rgba(255,240,220,.45)"; g.beginPath(); g.ellipse(ex - 1.3 * s, ey - 1.8 * s, 1.3 * s, 1.8 * s, 0, 0, Math.PI * 2); g.fill();
      }
    }
  }

  // 옆에 두는 소품 (바닥 기준 0에 선다)
  function drawProp(scene, p, x, y, s, now) {
    g.save(); g.translate(x, y); g.scale(s, s); g.lineJoin = "round";
    const name = (PROPS[scene] || [])[p] || "";
    g.fillStyle = "rgba(0,0,0,.15)"; g.beginPath(); g.ellipse(0, 0, 9, 2.5, 0, 0, Math.PI * 2); g.fill();
    if (name === "아이스 아메리카노" || name === "식혜") {
      const liq = name === "식혜" ? "#efe0b8" : "#4e2c18";
      g.fillStyle = "rgba(235,245,250,.75)"; g.strokeStyle = "#7d8891"; g.lineWidth = 1;
      g.beginPath(); g.moveTo(-7, -20); g.lineTo(7, -20); g.lineTo(5, 0); g.lineTo(-5, 0); g.closePath(); g.fill(); g.stroke();
      g.fillStyle = liq; g.beginPath(); g.moveTo(-6.4, -15); g.lineTo(6.4, -15); g.lineTo(5, -0.5); g.lineTo(-5, -0.5); g.closePath(); g.fill();
      g.fillStyle = "rgba(255,255,255,.7)"; g.fillRect(-4, -14, 3.5, 3.5); g.fillRect(1, -12, 3.5, 3.5);
      if (name === "식혜") { g.fillStyle = "#fff"; for (let i = 0; i < 6; i++) g.fillRect(-4 + (i * 7 % 9), -8 + (i * 3 % 6), 1.4, 1.4); }
      g.strokeStyle = name === "식혜" ? "#d65a4a" : "#2fa35a"; g.lineWidth = 2; g.beginPath(); g.moveTo(2, -19); g.lineTo(5, -30); g.stroke();
    } else if (name === "맥주 한 캔") {
      const gr = g.createLinearGradient(-5, 0, 5, 0); gr.addColorStop(0, "#9aa4ac"); gr.addColorStop(0.5, "#eef2f4"); gr.addColorStop(1, "#8b959d");
      g.fillStyle = gr; roundRect(-5, -18, 10, 18, 2); g.fill();
      g.fillStyle = "#e0b21f"; g.fillRect(-5, -12, 10, 6);
      g.fillStyle = "#c9d0d5"; g.beginPath(); g.ellipse(0, -18, 5, 1.6, 0, 0, Math.PI * 2); g.fill();
    } else if (name === "옥상 고양이") {
      const tail = Math.sin(now / 380) * 5;
      g.strokeStyle = "#d98d45"; g.lineWidth = 3; g.lineCap = "round";
      g.beginPath(); g.moveTo(-7, -3); g.quadraticCurveTo(-16, -6, -14 + tail, -16); g.stroke();
      g.fillStyle = "#e8a45a"; g.beginPath(); g.ellipse(0, -7, 8, 7, 0, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.arc(4, -16, 6, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.moveTo(0, -20); g.lineTo(1, -26); g.lineTo(4, -21); g.moveTo(5, -21); g.lineTo(8, -26); g.lineTo(9, -19); g.fill();
      g.fillStyle = "#1b2329"; g.fillRect(2, -17, 1.4, 2); g.fillRect(6, -17, 1.4, 2);
    } else if (name === "사직서 봉투") {
      g.rotate(-0.18);
      g.fillStyle = "#fff"; g.strokeStyle = "#7d8891"; g.lineWidth = 1; g.fillRect(-11, -16, 22, 15); g.strokeRect(-11, -16, 22, 15);
      g.beginPath(); g.moveTo(-11, -16); g.lineTo(0, -8); g.lineTo(11, -16); g.stroke();
      g.fillStyle = "#c8372b"; g.font = '6.5px "Do Hyeon", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("사직서", 0, -4.5);
    } else if (name === "노트북") {
      g.fillStyle = "#3b434b"; g.beginPath(); g.moveTo(-12, 0); g.lineTo(12, 0); g.lineTo(9, -4); g.lineTo(-9, -4); g.closePath(); g.fill();
      g.fillStyle = "#2c3238"; g.fillRect(-10, -19, 20, 15);
      g.fillStyle = "#bfe3ff"; g.fillRect(-8.5, -17.5, 17, 12);
      g.fillStyle = "#7fb3d9"; g.fillRect(-7, -15, 9, 1.5); g.fillRect(-7, -12, 12, 1.5);
    } else if (name === "바나나우유") {
      g.fillStyle = "#ffd84d"; g.beginPath(); g.ellipse(0, -8, 6.5, 8, 0, 0, Math.PI * 2); g.fill();
      g.fillRect(-3, -19, 6, 5); g.fillStyle = "#fff"; g.fillRect(-3.5, -21, 7, 3);
      g.strokeStyle = "#2f7fd6"; g.lineWidth = 1.6; g.beginPath(); g.moveTo(1, -21); g.lineTo(4, -29); g.stroke();
    } else if (name === "휴대폰 충전 중") {
      g.strokeStyle = "#f2f5f7"; g.lineWidth = 1.2; g.beginPath(); g.moveTo(0, -1); g.quadraticCurveTo(10, 2, 14, -6); g.stroke();
      g.fillStyle = "#1b2329"; roundRect(-5, -16, 10, 16, 2); g.fill();
      g.fillStyle = "#7dffa0"; g.fillRect(-3.5, -14, 7, 12 * ((now / 3000) % 1));
    } else if (name === "만화책") {
      const cs = ["#d65a4a", "#3b6fb6", "#e0a43a"];
      cs.forEach((col, i) => { g.fillStyle = col; g.fillRect(-9 + (i % 2) * 2, -4 - i * 4, 18, 4); g.fillStyle = "#fff"; g.fillRect(7 + (i % 2) * 2, -3.5 - i * 4, 1.5, 3); });
    }
    g.restore();
  }

  // 한숨 효과 (머리 위). 밝은 바닥에서도 보이게 테두리·그림자·진한 말풍선.
  const EMOTE_MS = 3400;
  function emoteLabel(x, y, text) {
    g.font = '700 12px "Gowun Dodum", sans-serif';
    const w = g.measureText(text).width + 16;
    g.fillStyle = "rgba(17,22,28,.86)"; roundRect(x - w / 2, y - 10, w, 20, 10); g.fill();
    g.fillStyle = "#fff"; g.fillText(text, x, y + 0.5);
  }
  function drawEmote(x, y, lv, age) {
    if (!lv || age < 0 || age > EMOTE_MS) return;
    const k = age / EMOTE_MS, a = Math.min(1, (EMOTE_MS - age) / 500, age / 150);
    g.save(); g.globalAlpha = a; g.textAlign = "center"; g.textBaseline = "middle";
    g.lineJoin = "round";
    if (lv === 1) { // 한숨 구름
      const yy = y - 14 - k * 30, grow = 0.9 + k * 0.4;
      g.shadowColor = "rgba(0,0,0,.25)"; g.shadowBlur = 6;
      g.fillStyle = "#f4f7f9"; g.strokeStyle = "#7d8891"; g.lineWidth = 2;
      g.beginPath();
      for (const [dx, dy, r] of [[-14, 3, 10], [0, -5, 13], [14, 2, 10], [4, 7, 10], [-6, 7, 9]]) { g.moveTo(x + dx + r * grow, yy + dy); g.arc(x + dx, yy + dy, r * grow, 0, Math.PI * 2); }
      g.stroke(); g.fill(); g.shadowBlur = 0;
      g.fillStyle = "#3f4a54"; g.font = '700 12px "Gowun Dodum", sans-serif'; g.fillText("하아…", x, yy + 1);
    } else if (lv === 2) { // 영혼 가출: 머리에서 빠져나와 둥실 떠오르는 유령 + 연결 실
      const yy = y - 20 - k * 70, sway = Math.sin(age / 200) * 6, gx = x + sway;
      g.setLineDash([3, 4]); g.strokeStyle = "rgba(255,255,255,.8)"; g.lineWidth = 1.5;
      g.beginPath(); g.moveTo(x, y + 6); g.quadraticCurveTo(x - 10, (y + yy) / 2, gx, yy + 16); g.stroke(); g.setLineDash([]);
      g.shadowColor = "rgba(120,200,255,.9)"; g.shadowBlur = 14;
      g.fillStyle = "#ffffff"; g.strokeStyle = "#2c3640"; g.lineWidth = 2;
      g.beginPath(); g.arc(gx, yy - 4, 15, Math.PI, 0); g.lineTo(gx + 15, yy + 16);
      for (let i = 0; i < 6; i++) g.lineTo(gx + 15 - (i + 0.5) * 5, yy + (i % 2 ? 16 : 10));
      g.lineTo(gx - 15, yy + 16); g.closePath(); g.fill(); g.shadowBlur = 0; g.stroke();
      g.fillStyle = "#1b2329"; g.beginPath(); g.arc(gx - 5, yy - 4, 2.4, 0, Math.PI * 2); g.arc(gx + 5, yy - 4, 2.4, 0, Math.PI * 2); g.fill();
      g.beginPath(); g.ellipse(gx, yy + 4, 2.5, 3.2, 0, 0, Math.PI * 2); g.fill();
      emoteLabel(gx, yy - 30, "영혼 가출 중…");
    } else { // 사직서 날리기
      const yy = y - 14 - k * 110, xx = x + k * 80, rot = -0.25 + k * 2.6;
      g.save(); g.translate(xx, yy); g.rotate(rot);
      g.shadowColor = "rgba(0,0,0,.35)"; g.shadowBlur = 8;
      g.fillStyle = "#fff"; g.fillRect(-19, -25, 38, 50); g.shadowBlur = 0;
      g.strokeStyle = "#2c3640"; g.lineWidth = 2; g.strokeRect(-19, -25, 38, 50);
      g.fillStyle = "#c8372b"; g.font = '13px "Do Hyeon", sans-serif'; g.fillText("사직서", 0, -12);
      g.fillStyle = "#9aa3ab"; for (let i = 0; i < 4; i++) g.fillRect(-13, 0 + i * 5, 26, 1.6);
      g.restore();
      if (k < 0.6) emoteLabel(x, y - 22, "사직서 던짐!");
    }
    g.restore();
  }

  // ---------- 밈 열차: 진짜 열차 사이에 무정차로 지나간다 (모두에게 같은 시각에) ----------
  const MEMES = [
    { name: "로또 1등행", note: "무정차 통과", stripe: "#e0b21f", dur: 2.6, dir: -1 },
    { name: "금요일행", note: "고장으로 지연 중", stripe: "#7a5bb0", dur: 11, dir: -1 },
    { name: "내집마련행", note: "역주행 중", stripe: "#d65a4a", dur: 3, dir: 1 },
    { name: "칼퇴행", note: "만석 · 무정차", stripe: "#2f9fd6", dur: 2.6, dir: -1 },
    { name: "연봉인상행", note: "이번 역 무정차", stripe: "#3cb37a", dur: 2.2, dir: -1 },
    { name: "주4일제행", note: "시운전 중", stripe: "#f08a2c", dur: 5, dir: -1 },
    { name: "월요일행", note: "정시 운행", stripe: "#5b6670", dur: 3.2, dir: -1 },
    { name: "정년보장행", note: "운행 종료된 노선", stripe: "#8c7a5b", dur: 3.5, dir: 1 }
  ];
  const MEME_SLOT = 50;
  function memeState(now) {
    const s = now / 1000, slot = Math.floor(s / MEME_SLOT), t0 = slot * MEME_SLOT + 14;
    let h = (slot * 2654435761) >>> 0; h ^= h >>> 15;
    const m = MEMES[h % MEMES.length];
    if (s < t0 || s > t0 + m.dur) return null;
    const a = trainState(t0 * 1000), b = trainState((t0 + m.dur + 2) * 1000);
    if (a.phase !== "gone" || b.phase !== "gone" || a.night) return null;
    const k = (s - t0) / m.dur, span = 2 * BW + 60;
    return { m, x: m.dir < 0 ? BW - k * span : -BW - 60 + k * span };
  }
  function drawMemeTrain(ms) {
    const { m, x } = ms;
    g.save(); g.translate(x, 0);
    g.fillStyle = "#e9edf0"; roundRect(-6, 214, BW + 40, 186, 14); g.fill();
    g.fillStyle = m.stripe; g.fillRect(-6, 312, BW + 46, 46);
    g.fillStyle = "#c9d0d5"; g.fillRect(-6, 386, BW + 46, 12);
    g.fillStyle = "#2c3a44"; for (let wx = 20; wx < BW + 20; wx += 70) { roundRect(wx, 236, 46, 58, 5); g.fill(); }
    g.fillStyle = "#fff"; g.font = '30px "Do Hyeon", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
    for (let tx = 150; tx < BW + 20; tx += 300) g.fillText(`${m.name} · ${m.note}`, tx, 336);
    g.restore();
  }

  function roundRect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  // ---------- 장면 ----------
  let ledOffset = 230; // 처음부터 글자가 보이게
  function ledText(tr) {
    const lines = ITEMS.map(it => `${it.name}행 ${dur(it.price)} 후 도착`);
    const head = tr.night ? "운행 종료 · 첫차 05:30" : tr.phase === "gone" ? `퇴근행 열차 ${waitText(tr.next)} 후 도착` : tr.phase === "arrive" ? "퇴근행 열차 들어옵니다" : tr.phase === "open" ? "퇴근행 열차 타세요" : "퇴근행 열차 출발합니다";
    return { head, scroll: lines.join("   ·   ") };
  }

  function drawScene(now, dt) {
    const tr = trainState(now);
    const memeNow = tr.x === null ? memeState(now) : null;
    // 천장
    g.fillStyle = C.night; g.fillRect(0, 0, W, H);
    g.fillStyle = "#1c232b"; g.fillRect(0, 0, W, 86);
    g.fillStyle = "#f4f8ff"; for (let x = 30; x < W; x += 110) { g.globalAlpha = .9; g.fillRect(x, 78, 60, 4); } g.globalAlpha = 1;
    // LED 안내판
    g.fillStyle = "#050607"; roundRect(14, 16, W - 28, 56, 6); g.fill();
    g.strokeStyle = "#2a3139"; g.lineWidth = 2; g.stroke();
    const led = ledText(tr);
    if (memeNow) led.head = `통과 열차 · ${memeNow.m.name}`;
    g.fillStyle = C.led; g.font = '15px "Do Hyeon", sans-serif'; g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText(led.head, 26, 34);
    // 실시간 접속자 (LED 오른쪽, 초록)
    const nNow = total > 0 ? total : others.size + 1;
    g.fillStyle = "#6dff8f"; g.textAlign = "right"; g.font = '600 13px "Nanum Gothic Coding", "Gowun Dodum", monospace';
    g.fillText(room ? `접속 ${nNow}명` : "", W - 26, 34); g.textAlign = "left";
    g.save(); roundRect(20, 46, W - 40, 22, 2); g.clip();
    g.font = '600 12px "Nanum Gothic Coding", "Gowun Dodum", monospace';
    const sw = g.measureText(led.scroll).width + 60;
    ledOffset = (ledOffset + dt * 0.045) % sw;
    g.fillStyle = "#ffb766";
    g.fillText(led.scroll, W - 20 - ledOffset, 57); g.fillText(led.scroll, W - 20 - ledOffset + sw, 57);
    g.restore();
    // 여기서부터 벽·선로·열차·스크린도어는 K배로 줄여 그린다
    g.save(); g.translate(0, 86); g.scale(K, K); g.translate(0, -86);
    // 벽 타일
    g.fillStyle = C.tile; g.fillRect(0, 86, BW, 300);
    g.strokeStyle = C.tile2; g.lineWidth = 1;
    for (let y = 86; y < 386; y += 14) { g.beginPath(); g.moveTo(0, y); g.lineTo(BW, y); g.stroke(); }
    for (let y = 86, r = 0; y < 386; y += 14, r++) for (let x = (r % 2) * 14; x < BW; x += 28) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 14); g.stroke(); }
    // 역명판 (가운데)
    g.save(); g.translate((BW - 360) / 2, 0);
    g.fillStyle = "#fff"; roundRect(40, 120, 280, 70, 8); g.fill();
    g.fillStyle = C.line; g.fillRect(40, 176, 280, 14);
    g.fillStyle = C.line; g.beginPath(); g.arc(78, 150, 18, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#fff"; g.font = '13px "Do Hyeon", sans-serif'; g.textAlign = "center"; g.fillText("주판", 78, 151);
    g.fillStyle = C.ink; g.font = '30px "Do Hyeon", sans-serif'; g.textAlign = "left"; g.fillText("내시간역", 106, 146);
    g.font = '600 10px "Nanum Gothic Coding", monospace'; g.fillStyle = "#5c6770"; g.fillText("TIME-PRICE STATION", 108, 167);
    g.restore();
    // 선로
    g.fillStyle = "#2b2f33"; g.fillRect(0, 386, BW, 40);
    g.fillStyle = "#6c7176"; g.fillRect(0, 404, BW, 3); g.fillRect(0, 418, BW, 3);
    // 열차
    if (tr.x !== null) drawTrain(tr.x, tr.door, now);
    else if (memeNow) drawMemeTrain(memeNow);
    // 스크린도어
    drawPSD(tr.door);
    g.restore();
    drawDirSigns(now);
    // 승강장 바닥 (넓다)
    const fl = g.createLinearGradient(0, PT, 0, H); fl.addColorStop(0, C.floor); fl.addColorStop(1, C.floor2);
    g.fillStyle = fl; g.fillRect(0, PT, W, H - PT);
    g.fillStyle = "#e8c53a"; g.fillRect(0, PT + 10, W, 7);
    g.fillStyle = "rgba(0,0,0,.12)"; for (let x = 4; x < W; x += 8) g.fillRect(x, PT + 12, 3, 3);
    for (const dx of DOOR_SX) { g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(dx - 14, PT + 22, 3, 11); g.fillRect(dx + 11, PT + 22, 3, 11); }
    // 바닥 줄눈 (넓은 바닥에 깊이감)
    g.strokeStyle = "rgba(0,0,0,.06)"; g.lineWidth = 1;
    for (let y = PT + 50; y < H; y += 46) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    return tr;
  }

  // ---------- 출근·퇴근 시계 (9시 출근, 점심 12~13시, 18시 퇴근, 주말 쉼) ----------
  const START_H = 9, END_H = 18;
  function nextWorkStart(now) {
    const d = new Date(now); d.setHours(START_H, 0, 0, 0);
    if (d.getTime() <= now) d.setDate(d.getDate() + 1);
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function schedule(now) {
    const d = new Date(now), day = d.getDay();
    const s = new Date(now); s.setHours(START_H, 0, 0, 0);
    const e = new Date(now); e.setHours(END_H, 0, 0, 0);
    const l1 = new Date(now); l1.setHours(12, 0, 0, 0);
    const l2 = new Date(now); l2.setHours(13, 0, 0, 0);
    if (day === 0 || day === 6) return { mode: "weekend", toWork: nextWorkStart(now) - now };
    if (now < s.getTime()) return { mode: "before", toWork: s.getTime() - now };
    if (now >= e.getTime()) return { mode: "after", toWork: nextWorkStart(now) - now, sinceOff: now - e.getTime() };
    const lunch = Math.max(0, Math.min(now, l2.getTime()) - l1.getTime());
    const workedMs = now - s.getTime() - Math.min(lunch, 3600000);
    return { mode: now >= l1.getTime() && now < l2.getTime() ? "lunch" : "work", toOff: e.getTime() - now, workedMs };
  }
  const hms = ms => {
    let s = Math.max(0, Math.floor(ms / 1000)); const dd = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (dd ? dd + "일 " : "") + h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  };

  function drawDirSigns(now) {
    const sc = schedule(now);
    const blink = Math.floor(now / 500) % 2 === 0;
    // 표지판: 위 = 역 이름(크게), 가운데 = 무엇까지, 아래 = 초 단위 시계
    const sign = (x, w, title, label, time, timeColor) => {
      g.fillStyle = "#1f6f3e"; roundRect(x, 98, w, 70, 8); g.fill();
      g.fillStyle = C.line; roundRect(x + 2, 100, w - 4, 28, 7); g.fill();
      g.textBaseline = "middle"; g.textAlign = "center";
      g.fillStyle = "#fff"; g.font = '18px "Do Hyeon", sans-serif'; g.fillText(title, x + w / 2, 115);
      g.fillStyle = "#bfe6cc"; g.font = '700 10px "Gowun Dodum", sans-serif'; g.fillText(label, x + w / 2, 139);
      g.fillStyle = timeColor; g.font = `600 ${time.length > 9 ? 10 : 14}px "Nanum Gothic Coding", "Gowun Dodum", monospace`; g.fillText(time, x + w / 2, 156);
    };
    const calm = "#ffffff", hot = blink ? "#ffd2c8" : "#ff7a63";
    let L, R;
    if (sc.mode === "work" || sc.mode === "lunch") {
      L = ["출근한 지", hms(sc.workedMs), calm];
      R = ["퇴근까지", hms(sc.toOff), sc.toOff < 3600000 ? hot : "#ffe08a"];
    } else if (sc.mode === "after") {
      L = ["다음 출근까지", hms(sc.toWork), sc.toWork < 3 * 3600000 ? hot : calm];
      R = ["퇴근한 지", hms(sc.sinceOff), "#bff5cf"];
    } else {
      L = ["출근까지", hms(sc.toWork), sc.toWork < 3600000 ? hot : calm];
      R = [sc.mode === "weekend" ? "오늘은" : "아직", sc.mode === "weekend" ? "쉬는 날" : "출근 전", "#bff5cf"];
    }
    sign(4, 84, "◀ 출근역", L[0], L[1], L[2]);
    sign(W - 88, 84, "퇴근역 ▶", R[0], R[1], R[2]);
    return sc;
  }

  function drawTrain(x, door, now) {
    g.save(); g.translate(x, 0);
    g.fillStyle = "#e9edf0"; roundRect(-6, 214, BW + 40, 186, 14); g.fill();
    g.fillStyle = C.line; g.fillRect(-6, 330, BW + 46, 14);
    g.fillStyle = "#c9d0d5"; g.fillRect(-6, 386, BW + 46, 12);
    for (const dx of DOORS) {
      // 창
      g.fillStyle = "#2c3a44";
      roundRect(dx - 75 + 18, 236, 34, 58, 5); g.fill(); roundRect(dx + 75 - 52, 236, 34, 58, 5); g.fill();
      // 문
      const open = door * 15;
      g.fillStyle = "#1f2a31"; g.fillRect(dx - 15, 236, 30, 148);
      g.fillStyle = "#dfe4e8";
      g.fillRect(dx - 15 - open, 230, 15, 156); g.fillRect(dx + open, 230, 15, 156);
      g.fillStyle = "#2c3a44"; g.fillRect(dx - 12 - open, 240, 9, 40); g.fillRect(dx + 3 + open, 240, 9, 40);
    }
    g.restore();
  }

  function drawPSD(door) {
    // 스크린도어 위 가로대 + 유리
    g.fillStyle = "#3a434b"; g.fillRect(0, 222, BW, 12);
    g.fillStyle = "#79ff9c"; for (const dx of DOORS) { g.globalAlpha = door > 0 ? 1 : .25; g.fillRect(dx - 6, 226, 12, 4); }
    g.globalAlpha = 1;
    g.fillStyle = "rgba(170,205,220,.18)"; g.fillRect(0, 234, BW, 192);
    g.fillStyle = "#59636c";
    for (let x = 0; x <= BW; x += 55) g.fillRect(x - 1.5, 234, 3, 192);
    for (const dx of DOORS) {
      const open = door * 22;
      g.fillStyle = "#8a959d"; g.fillRect(dx - 24 - open, 234, 3, 192); g.fillRect(dx + 21 + open, 234, 3, 192);
      if (door > 0) { g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(dx - 21, 234, 42, 192); g.fillStyle = "rgba(170,205,220,.10)"; g.fillRect(dx - 24 - open, 234, open + 3, 192); g.fillRect(dx + 21, 234, open + 3, 192); }
    }
    g.fillStyle = "#59636c"; g.fillRect(0, 422, BW, 6);
  }

  // ---------- 옥상·찜질방 공통: 위쪽 안내판 (옥상=옆 건물 전광판, 찜질방=벽걸이 TV) ----------
  let boardOff = 230;
  function drawBoard(tv, head, scroll, dt) {
    g.fillStyle = tv ? "#0d0f12" : "#050607"; roundRect(14, 16, W - 28, 56, tv ? 8 : 6); g.fill();
    g.strokeStyle = tv ? "#30353d" : "#2a3139"; g.lineWidth = tv ? 4 : 2; g.stroke();
    if (tv) { const sg = g.createLinearGradient(0, 22, 0, 66); sg.addColorStop(0, "#14304f"); sg.addColorStop(1, "#0b1a2c"); g.fillStyle = sg; g.fillRect(20, 22, W - 40, 44); }
    g.fillStyle = tv ? "#ffffff" : C.led; g.font = '15px "Do Hyeon", sans-serif'; g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText(head, 26, 34);
    g.fillStyle = "#6dff8f"; g.textAlign = "right"; g.font = '600 13px "Nanum Gothic Coding", "Gowun Dodum", monospace';
    g.fillText(room ? `접속 ${total > 0 ? total : others.size + 1}명` : "", W - 26, 34); g.textAlign = "left";
    g.save(); roundRect(20, 46, W - 40, 20, 2); g.clip();
    if (tv) { g.fillStyle = "#c8372b"; g.fillRect(20, 46, W - 40, 20); }
    g.font = '600 12px "Nanum Gothic Coding", "Gowun Dodum", monospace';
    const sw = g.measureText(scroll).width + 60;
    boardOff = (boardOff + dt * 0.045) % sw;
    g.fillStyle = tv ? "#fff" : "#ffb766";
    g.fillText(scroll, W - 20 - boardOff, 57); g.fillText(scroll, W - 20 - boardOff + sw, 57);
    g.restore();
  }

  const hourOf = ms => { const d = new Date(ms); return d.getHours() + d.getMinutes() / 60; };
  function roofSky(ms) {
    const h = hourOf(ms);
    if (h >= 6 && h < 8.5) return { top: "#7aa6d6", bot: "#ffc7a3", far: "#9aa8bb", near: "#74849a", lit: 0.15, sun: "#ffe2a8" };
    if (h >= 8.5 && h < 16) return { top: "#5d9ee0", bot: "#d3ebf8", far: "#a9bccd", near: "#8296aa", lit: 0, sun: "#fff6d6" };
    if (h >= 16 && h < 19) return { top: "#4a5a9a", bot: "#ffb37a", far: "#706c8c", near: "#514d6c", lit: 0.45, sun: "#ffcf8a" };
    return { top: "#0b1430", bot: "#22305a", far: "#1c2540", near: "#141b30", lit: 1, sun: null };
  }
  function cityLayer(base, n, seed, minH, maxH, col, lit) {
    for (let i = 0; i < n; i++) {
      const r1 = ((i + 1) * (seed * 7919) % 997) / 997, r2 = ((i + 3) * (seed * 104729) % 991) / 991;
      const bw = 20 + r1 * 24, bh = minH + r2 * (maxH - minH), bx = i * (W + 40) / n - 20 + r1 * 10;
      g.fillStyle = col; g.fillRect(bx, base - bh, bw, bh);
      if (lit) { g.fillStyle = `rgba(255,214,120,${0.6 * lit})`; for (let wy = base - bh + 5; wy < base - 4; wy += 7) for (let wx = bx + 3; wx < bx + bw - 3; wx += 6) if (((wx * 7 + wy * 13 + i) | 0) % 3 === 0) g.fillRect(wx, wy, 2, 3); }
      else { g.fillStyle = "rgba(255,255,255,.12)"; for (let wy = base - bh + 6; wy < base - 4; wy += 9) g.fillRect(bx + 3, wy, bw - 6, 2); }
    }
  }

  // 회사 옥상: 하늘·빌딩숲·난간·물탱크 얹은 계단실·실외기·벤치·스티로폼 텃밭, 초록 우레탄 바닥
  function drawRoof(now, dt, t) {
    const sky = roofSky(now), h = hourOf(now);
    const gr = g.createLinearGradient(0, 0, 0, PT); gr.addColorStop(0, sky.top); gr.addColorStop(1, sky.bot);
    g.fillStyle = gr; g.fillRect(0, 0, W, PT);
    if (sky.sun) { const k = Math.max(0, Math.min(1, (h - 6) / 13)); g.fillStyle = sky.sun; g.globalAlpha = .9; g.beginPath(); g.arc(30 + k * 300, 120 + Math.abs(k - 0.45) * 90, 16, 0, Math.PI * 2); g.fill(); g.globalAlpha = 1; }
    else { g.fillStyle = "#f4f1dc"; g.beginPath(); g.arc(300, 104, 10, 0, Math.PI * 2); g.fill(); }
    // 구름
    g.fillStyle = sky.lit >= 1 ? "rgba(255,255,255,.08)" : "rgba(255,255,255,.8)";
    for (let i = 0; i < 4; i++) {
      const cx = ((i * 137 + now / 1000 * (3 + i)) % (W + 160)) - 80, cy = 96 + i * 19;
      g.beginPath(); g.ellipse(cx, cy, 26, 8, 0, 0, Math.PI * 2); g.ellipse(cx + 14, cy - 5, 16, 8, 0, 0, Math.PI * 2); g.ellipse(cx - 12, cy - 3, 12, 6, 0, 0, Math.PI * 2); g.fill();
    }
    // 전광판 기둥 (멀리 건물 위)
    g.fillStyle = "#3a4048"; g.fillRect(70, 70, 5, 90); g.fillRect(W - 75, 70, 5, 90);
    cityLayer(PT - 44, 14, 3, 50, 130, sky.far, sky.lit);
    cityLayer(PT - 44, 8, 5, 30, 80, sky.near, sky.lit);
    // 난간 + 파라펫
    g.fillStyle = "#cfc9be"; g.fillRect(0, PT - 30, W, 30);
    g.fillStyle = "#e4dfd5"; g.fillRect(0, PT - 34, W, 5);
    g.fillStyle = "rgba(0,0,0,.08)"; for (let x = 0; x < W; x += 60) g.fillRect(x, PT - 29, 1.5, 29);
    g.strokeStyle = "#5d6670"; g.lineWidth = 2;
    g.beginPath(); g.moveTo(0, PT - 62); g.lineTo(W, PT - 62); g.moveTo(0, PT - 48); g.lineTo(W, PT - 48); g.stroke();
    g.lineWidth = 1.5; for (let x = 6; x < W; x += 14) { g.beginPath(); g.moveTo(x, PT - 62); g.lineTo(x, PT - 34); g.stroke(); }
    // 계단실 + 물탱크 (오른쪽)
    g.fillStyle = "#6f7880"; g.fillRect(282, PT - 168, 4, 44); g.fillRect(332, PT - 168, 4, 44);
    g.fillStyle = "#3f86c6"; roundRect(276, PT - 196, 64, 46, 8); g.fill();
    g.fillStyle = "#5aa0dc"; g.beginPath(); g.ellipse(308, PT - 196, 32, 6, 0, 0, Math.PI * 2); g.fill();
    g.fillStyle = "rgba(0,0,0,.15)"; g.fillRect(276, PT - 182, 64, 3); g.fillRect(276, PT - 166, 64, 3);
    g.fillStyle = "#d8d2c6"; g.fillRect(262, PT - 126, 98, 152);
    g.fillStyle = "#c6bfb2"; g.fillRect(262, PT - 130, 98, 6);
    g.fillStyle = "#7d8f86"; g.fillRect(286, PT - 44, 34, 70);
    g.fillStyle = "#cfd6d2"; g.fillRect(313, PT - 8, 4, 8);
    g.fillStyle = "#1f9a4a"; g.fillRect(287, PT - 64, 32, 13);
    g.fillStyle = "#fff"; g.font = '9px "Do Hyeon", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle"; g.fillText("비상구", 303, PT - 57);
    // 실외기 (왼쪽, 팬 돌아감)
    for (let i = 0; i < 3; i++) {
      const ux = 8 + i * 40, uy = PT - 6;
      g.fillStyle = "#e9ecee"; g.fillRect(ux, uy, 36, 30); g.fillStyle = "#c3c9ce"; g.fillRect(ux, uy + 27, 36, 3);
      g.strokeStyle = "#8d969e"; g.lineWidth = 1.5; g.beginPath(); g.arc(ux + 18, uy + 14, 10, 0, Math.PI * 2); g.stroke();
      const a = now / (90 + i * 20);
      g.beginPath(); for (let b = 0; b < 3; b++) { const an = a + b * 2.094; g.moveTo(ux + 18, uy + 14); g.lineTo(ux + 18 + Math.cos(an) * 9, uy + 14 + Math.sin(an) * 9); } g.stroke();
    }
    // 바닥: 초록 우레탄 방수
    const fl = g.createLinearGradient(0, PT, 0, H); fl.addColorStop(0, "#5f9a6a"); fl.addColorStop(1, "#467d53");
    g.fillStyle = fl; g.fillRect(0, PT + 24, W, H - PT - 24);
    g.fillStyle = "#5f9a6a"; g.fillRect(0, PT, 262, 24);
    g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(0, PT, W, 4);
    g.strokeStyle = "rgba(255,255,255,.07)"; g.lineWidth = 1;
    for (let y = PT + 50; y < H; y += 46) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    g.fillStyle = "rgba(255,255,255,.1)"; g.beginPath(); g.ellipse(250, PT + 120, 34, 7, 0, 0, Math.PI * 2); g.fill(); // 물웅덩이
    g.fillStyle = "#3c444c"; g.fillRect(170, PT + 30, 16, 6); // 배수구
    // 스티로폼 텃밭 + 벤치
    g.fillStyle = "#f4f4f0"; g.fillRect(132, PT + 2, 40, 18); g.fillStyle = "#dcdcd6"; g.fillRect(132, PT + 16, 40, 4);
    g.fillStyle = "#5fb04a"; for (let i = 0; i < 5; i++) { g.beginPath(); g.ellipse(137 + i * 8, PT + 1, 4, 6, (i % 2 ? .4 : -.4), 0, Math.PI * 2); g.fill(); }
    g.fillStyle = "#7c8389"; g.fillRect(196, PT + 26, 3, 14); g.fillRect(248, PT + 26, 3, 14);
    g.fillStyle = "#9b6b43"; g.fillRect(190, PT + 22, 66, 6); g.fillStyle = "#86593a"; g.fillRect(190, PT + 10, 66, 5);
  }

  // 찜질방 마루: 나무 벽·불가마·벽시계·매점, 마루 바닥. 밤 11시~새벽 6시는 소등.
  function drawSauna(now, dt, t) {
    g.fillStyle = "#4a2f1c"; g.fillRect(0, 0, W, 86);
    for (let x = 40; x < W; x += 92) { g.fillStyle = "rgba(255,200,120,.25)"; g.beginPath(); g.arc(x, 80, 18, 0, Math.PI * 2); g.fill(); g.fillStyle = "#ffe2a8"; g.beginPath(); g.arc(x, 80, 5, 0, Math.PI * 2); g.fill(); }
    for (let x = 0, i = 0; x < W; x += 24, i++) { g.fillStyle = i % 2 ? "#b5804f" : "#a87445"; g.fillRect(x, 86, 24, PT - 86); }
    g.fillStyle = "rgba(0,0,0,.12)"; for (let x = 0; x < W; x += 24) g.fillRect(x, 86, 1.5, PT - 86);

    g.fillStyle = C.led; g.font = '14px "Do Hyeon", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
    g.fillText(lines[Math.floor(age / 3200) % lines.length], W / 2, 47);
    // 나 (창가에 서서)
    drawPerson(W * 0.24, (H - 70 - FOOT_TOP()) / FOOT_RANGE(), { lk: look, isMe: true, now: t, c: myColor });
    // 문구
    const a = Math.max(0, Math.min(1, (age - 1200) / 800)) * Math.max(0, Math.min(1, (RIDE_MS - age) / 700));
    const sc = schedule(now), lu = lupan.ms / 1000 * hourly() / 3600;
    let big, sub;
    if (sc.mode === "work") { big = "조기 퇴근 상상 중…"; sub = "현실: 퇴근까지 " + hms(sc.toOff); }
    else if (sc.mode === "lunch") { big = "점심 탈출 중"; sub = "복귀까지 " + hms(new Date(now).setHours(13, 0, 0, 0) - now); }
    else if (sc.mode === "weekend") { big = "주말인데 왜 여기에"; sub = "다음 출근까지 " + hms(sc.toWork); }
    else { big = "오늘도 버텼다"; sub = "자유시간 시작 · 다음 출근까지 " + hms(sc.toWork); }
    g.globalAlpha = a;
    g.fillStyle = "rgba(0,0,0,.35)"; roundRect(winX + 16, winY + 22, winW - 32, lu >= 1 ? 104 : 84, 12); g.fill();
    g.fillStyle = "#fff"; g.font = '30px "Do Hyeon", sans-serif'; g.fillText(big, W / 2, winY + 54);
    g.font = '600 12px "Nanum Gothic Coding", "Gowun Dodum", monospace'; g.fillStyle = "#ffe08a"; g.fillText(sub, W / 2, winY + 84);
    if (lu >= 1) { g.fillStyle = "#cfe9d6"; g.font = '700 12px "Gowun Dodum", sans-serif'; g.fillText(`오늘 여기서 루팡한 돈 ${comma(lu)}원`, W / 2, winY + 106); }
    g.globalAlpha = 1;
    // 끝날 때 잠깐 어두워짐
    const fade = Math.max(0, (age - (RIDE_MS - 600)) / 600);
    if (fade > 0) { g.fillStyle = `rgba(0,0,0,${Math.min(1, fade)})`; g.fillRect(0, 0, W, H); }
  }

  // 오늘 루팡 누적 (이 기기에만, 날짜 바뀌면 0부터)
  const LUPAN_KEY = "zoopan-station-lupan";
  const todayKey = () => new Date(clock()).toDateString();
  let lupan = { day: todayKey(), ms: 0 }, lupanSaved = 0;
  try { const v = JSON.parse(localStorage.getItem(LUPAN_KEY) || "null"); if (v && v.day === lupan.day && v.ms > 0) lupan.ms = v.ms; } catch (e) {}
  function saveLupan() {
    if (lupan.day !== todayKey()) lupan = { day: todayKey(), ms: 0 };
    try { localStorage.setItem(LUPAN_KEY, JSON.stringify(lupan)); } catch (e) {}
  }
  addEventListener("pagehide", saveLupan);
  if (new URLSearchParams(location.search).has("ride")) { me.st = "ride"; rideT0 = performance.now() - (Number(new URLSearchParams(location.search).get("ride")) || 0); } // 시험용: ?ride=3000 (3초 지난 장면)
  // ---------- 장소 바꾸기 ----------
  let fadeT = -1e9;
  const SCENE_HINT = {
    roof: "회사 옥상 · 합법적 농땡이 중<br>누르면 걸어가요 · 눕기도 돼요",
    station: "퇴근 시간! 내시간역<br>19시까지 퇴근 열차가 다녀요",
    sauna: "찜질방 · 다 같이 드러눕기<br>누워 있으면 계란이 구워져요"
  };
  function enterScene(sc, t) {
    curScene = sc; me.q = null; me.st = "wait"; me.tx = me.x; fadeT = t;
    cv.setAttribute("aria-label", sc === "station" ? "퇴근길 지하철 승강장. 화면을 누르면 내 캐릭터가 그 자리로 걸어가요." : sc === "roof" ? "회사 옥상. 화면을 누르면 걸어가고, 눕기 버튼으로 누울 수 있어요." : "찜질방 마루. 화면을 누르면 걸어가고, 눕기 버튼으로 누워 쉴 수 있어요.");
    $("deco").hidden = sc === "station";
    toast(SCENE_HINT[sc], 3400); sendPresence();
  }
  function step(t) {
    const dt = Math.min(64, t - last); last = t;
    const now = clock();
    // 월급루팡 타이머: 근무 시간에 이 화면을 보고 있는 동안 회사 돈이 쌓인다 (점심시간은 내 시간이라 멈춤)
    if (schedule(now).mode === "work" && !document.hidden) { lupan.ms += dt; if (t - lupanSaved > 5000) { saveLupan(); lupanSaved = t; } }
    const want = sceneAt(now);
    if (want !== curScene && !["ride", "in", "going"].includes(me.st)) enterScene(want, t);
    // 열차 안: 승강장 대신 퇴근 열차 장면
    if (me.st === "ride") {
      drawRide(now, t - rideT0, t);
      const btn = $("board"); btn.hidden = false; if (btn.textContent !== "내리기") btn.textContent = "내리기";
      if (t - rideT0 > RIDE_MS) endRide();
      prevPhase = trainState(now).phase;
      return;
    }
    if (curScene === "station") stepStation(t, dt, now); else stepRest(t, dt, now);
    if (t - fadeT < 700) { g.fillStyle = `rgba(0,0,0,${1 - (t - fadeT) / 700})`; g.fillRect(0, 0, W, H); }
  }

  // 내 머리 위: 루팡 금액(근무 중) + 튀어 오르는 동전 + 한숨
  function drawMyHud(hx, topY, t, dt, now) {
    const sc = schedule(now), perSec = hourly() / 3600, work = sc.mode === "work" || sc.mode === "lunch";
    if (work) {
      const txt = (sc.mode === "lunch" ? "점심 · 루팡 " : "루팡 ") + comma(lupan.ms / 1000 * perSec) + "원";
      g.font = '700 11px "Gowun Dodum", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
      const w = g.measureText(txt).width + 14;
      g.fillStyle = "rgba(255,224,138,.95)"; roundRect(hx - w / 2, topY, w, 17, 8.5); g.fill();
      g.fillStyle = C.night; g.fillText(txt, hx, topY + 8.8);
      const sec = Math.floor(now / 1000);
      if (sc.mode === "work" && sec !== lastCoinSec) { lastCoinSec = sec; coins.push({ x: hx + (Math.random() * 24 - 12), y: topY - 4, t: 0 }); }
    }
    drawEmote(hx, topY - (work ? 22 : 4), myEmote.lv, t - myEmote.t0);
    const coinTxt = "+" + (perSec < 10 ? perSec.toFixed(1) : comma(perSec)) + "원";
    g.font = '600 11px "Nanum Gothic Coding", monospace'; g.textAlign = "center";
    for (const c of coins) { c.t += dt; c.y -= dt * 0.028; g.globalAlpha = Math.max(0, 1 - c.t / 1100); g.fillStyle = "#ffcf3f"; g.fillText(coinTxt, c.x, c.y); }
    g.globalAlpha = 1;
    while (coins.length && coins[0].t > 1100) coins.shift();
  }

  // ---------- 옥상·찜질방 한 프레임 ----------
  let pops = [];
  function stepRest(t, dt, now) {
    const roof = curScene === "roof", sc = schedule(now);
    const lu = lupan.ms / 1000 * hourly() / 3600;
    if (roof) {
      drawRoof(now, dt, t);
      const head = sc.mode === "work" || sc.mode === "lunch" ? `퇴근까지 ${hms(sc.toOff)}` : sc.mode === "before" ? `출근까지 ${hms(sc.toWork)}` : "회사 옥상";
      const lines = [lu >= 1 ? `오늘 합법적 농땡이 ${comma(lu)}원어치` : "옥상은 오늘도 조용합니다", lu >= 470 ? `농땡이로 번 돈 = 아메리카노 ${(lu / 4700).toFixed(1)}잔` : "근무 시간에 이 화면을 보면 루팡 금액이 쌓여요", "옥상은 CCTV 사각지대입니다 (아마도)", "17:00 내시간역 개방 · 19:00 찜질방 개장"];
      drawBoard(false, head, lines.join("   ·   "), dt);
    } else {
      drawSauna(now, dt, t);
      const night = saunaNight(now), dp = daysToPayday(now);
      const head = night ? "소등 · 조용히 쉬는 시간" : eggs.n ? `오늘 구운 계란 ${eggs.n}개` : "찜질방 채널 · 아무것도 안 하기";
      const lines = ["속보: 오늘도 버텼다", dp === 0 ? "오늘은 월급날" : `월급날까지 ${dp}일`, "누워 있으면 1분마다 계란이 하나씩 구워져요", sc.mode === "weekend" ? "주말 · 출근 생각 금지" : "07:00 회사 옥상 개방"];
      drawBoard(true, head, lines.join("   ·   "), dt);
    }
    // 내 걸음
    let walking = false;
    if (me.st === "wait" && Math.abs(me.tx - me.x) > 0.003) { me.x += Math.sign(me.tx - me.x) * Math.min(0.00022 * dt, Math.abs(me.tx - me.x)); walking = true; }
    const lie = me.st === "lie", s = depthS(me.depth), my = depthY(me.depth);
    // 계란 굽기
    if (!roof && lie && !document.hidden) {
      if (eggs.day !== new Date(now).toDateString()) eggs = { day: new Date(now).toDateString(), n: 0, ms: 0 };
      eggs.ms += dt;
      if (eggs.ms >= EGG_MS) { eggs.ms -= EGG_MS; eggs.n++; saveEggs(); sendPresence(); pops.push({ x: me.x * W - 54 * s, y: my - 40 * s, t: 0, text: "+계란 1" }); }
    }
    const items = [];
    // 배경 사람(가격표 없음): 혼자일 때 덜 썰렁하게
    if (others.size < 4) {
      if (roof) [[112, -0.2, 7], [236, -0.17, 12]].forEach(([x, d, sd]) => items.push({ y: depthY(d), f: () => drawNPC(x, depthY(d), sd, t) }));
      else [[150, -0.2, 2], [252, -0.12, 4]].forEach(([x, d, lk]) => items.push({ y: depthY(d), f: () => drawPerson(x, d, { lk, scene: "sauna", pose: "lie", npc: true, alpha: 0.7, now: t }) }));
    }
    const working = ["work", "lunch"].includes(sc.mode);
    const peers = [];
    for (const o of others.values()) {
      o.dx += (o.x - o.dx) * Math.min(1, dt / 250);
      if (o.sc !== SCENES.indexOf(curScene)) continue;
      peers.push(o);
      items.push({ y: depthY(o.d), f: () => drawPerson(o.dx * W, o.d, { lk: o.lk, label: working ? `루팡 ${o.m}분` : `${o.m}분째`, walking: Math.abs(o.x - o.dx) > 0.004, now: t, scene: curScene, pose: o.st === "lie" ? "lie" : "stand", c: o.c, p: o.p, k: o.k }) });
    }
    items.push({ y: my, f: () => drawPerson(me.x * W, me.depth, { lk: look, label: "나", isMe: true, walking, now: t, scene: curScene, pose: lie ? "lie" : "stand", c: myColor, p: myProp[curScene], k: roof ? 0 : eggs.n }) });
    items.sort((a, b) => a.y - b.y);
    for (const it of items) it.f();
    if (!roof && saunaNight(now)) { g.fillStyle = "rgba(8,10,28,.35)"; g.fillRect(0, 0, W, H); }
    // 머리 위
    const hx = lie ? me.x * W - 25 * s : me.x * W, topY = my - (lie ? 72 : 112) * s;
    drawMyHud(hx, topY, t, dt, now);
    for (const o of peers) if (o.e) { const os = depthS(o.d); drawEmote(o.st === "lie" ? o.dx * W - 25 * os : o.dx * W, depthY(o.d) - (o.st === "lie" ? 72 : 112) * os, o.e, t - o.eT); }
    // +계란
    g.font = '700 12px "Gowun Dodum", sans-serif'; g.textAlign = "center"; g.textBaseline = "middle";
    for (const p of pops) { p.t += dt; g.globalAlpha = Math.max(0, 1 - p.t / 1600); g.fillStyle = "#fff3c4"; g.strokeStyle = "rgba(0,0,0,.4)"; g.lineWidth = 3; const yy = p.y - p.t * 0.02; g.strokeText(p.text, p.x, yy); g.fillText(p.text, p.x, yy); }
    g.globalAlpha = 1; pops = pops.filter(p => p.t < 1600);
    drawNextChip(now);
    const btn = $("board"), bt = lie ? "일어나기" : "눕기";
    btn.hidden = false; if (btn.textContent !== bt) btn.textContent = bt;
    if (room && (walking || t - lastSent > 5000) && t - lastSent > 120) { sendPresence(); lastSent = t; }
  }

  // ---------- 승강장 한 프레임 ----------
  function stepStation(t, dt, now) {
    const tr = drawScene(now, dt);

    // 내 걸음
    const spd = 0.00022 * dt;
    let walking = false;
    if (Math.abs(me.tx - me.x) > 0.003) { me.x += Math.sign(me.tx - me.x) * Math.min(spd, Math.abs(me.tx - me.x)); walking = true; }
    if (me.st === "going" && !walking) {
      if (tr.phase === "open") { me.st = "in"; me.walkT = 0; sendPresence(); }
      else { me.st = "wait"; }
    }
    if (me.st === "in") me.walkT = Math.min(1, me.walkT + dt / 400);

    // 줄 서 있을 때: 내 열차가 떠났으면 다음 열차로, 내 차례가 오면 탄다
    if (me.st === "queue" && me.q) {
      while (me.q.id && ((tr.phase === "gone" && me.q.id <= tr.id) || (tr.phase !== "gone" && me.q.id < tr.id))) {
        me.q.pos = Math.max(0, me.q.pos - boardedFinal(plan(me.q.id), me.q.idx));
        const nx = nextTrain(me.q.id + 1); me.q.id = nx ? nx.e : 0;
      }
      let ahead = me.q.pos;
      if (tr.phase !== "gone" && me.q.id === tr.id) {
        const p = plan(tr.id); ahead = me.q.pos - boardedNow(p, me.q.idx, tr.dt);
        if (tr.phase === "open" && ahead <= 0 && me.q.pos < p.cap) {
          me.st = "going"; me.tx = DOOR_SX[me.q.idx] / W; me.depth = -0.2; me.q = null;
        }
      }
      if (me.q) {
        me.ahead = Math.max(0, ahead);
        const sp = slotPos(me.q.idx, me.ahead);
        me.tx = sp.x / W; me.depth = (sp.y - FOOT_TOP()) / FOOT_RANGE();
      }
    }

    // 다른 접속자: 부드럽게 따라가기
    const people = [];
    for (const o of others.values()) {
      o.dx += (o.x - o.dx) * Math.min(1, dt / 250);
      if (o.sc !== 1) continue; // 다른 장소에 있는 사람
      if (o.st === "in" && (tr.phase === "leave" || tr.phase === "gone")) continue;
      const working = ["work", "lunch"].includes(schedule(now).mode);
      people.push({ x: o.dx * W, d: o.d, lk: o.lk, label: working ? `루팡 ${o.m}분` : `${o.m}분째`, me: false, o, walk: Math.abs(o.x - o.dx) > 0.004, a: o.st === "in" ? 0.0 : 1 });
    }
    if (!(me.st === "in" && me.walkT >= 1)) people.push({ x: me.x * W, d: me.depth, lk: look, label: "1분 " + comma(perMin()) + "원", me: true, walk: walking, a: me.st === "in" ? 1 - me.walkT : 1 });
    // 줄 선 승객 + 접속자를 앞뒤 순서대로 그린다
    const items = [];
    if (!tr.night) DOOR_SX.forEach((dx, i) => {
      const nq = Math.max(0, visibleQueue(tr, i));
      const mySlot = me.st === "queue" && me.q && me.q.idx === i ? me.ahead : -1;
      for (let k = 0; k < nq; k++) {
        const slot = mySlot >= 0 && k >= mySlot ? k + 1 : k;
        const sp = slotPos(i, slot), seed = (k * 7 + i * 13) % 97;
        items.push({ y: sp.y, f: () => drawNPC(sp.x + (seed % 5) - 2, sp.y, seed, t) });
      }
    });
    for (const p of people) if (p.a > 0) items.push({ y: depthY(p.d), f: () => drawPerson(p.x, p.d, { lk: p.lk, label: p.label, isMe: p.me, walking: p.walk, now: t, alpha: p.a, c: p.me ? myColor : p.o.c }) });
    items.sort((a, b) => a.y - b.y);
    for (const it of items) it.f();

    // 버튼: 줄서기 → (내 차례) 타기 / 줄 서는 중엔 앞사람 수
    const btn = $("board");
    const btnText = tr.night ? "" : me.st === "queue" ? `앞 ${me.ahead}명 · 나가기` : me.st === "wait" ? (tr.phase === "open" ? "타기" : "줄서기") : "";
    btn.hidden = !btnText;
    if (btnText && btn.textContent !== btnText) btn.textContent = btnText;

    // 내 머리 위: 루팡 금액·동전·한숨
    const meP = people.find(p => p.me);
    if (meP && meP.a > 0) {
      const topY = depthY(meP.d) - 112 * depthS(meP.d);
      if (miss) miss.x = meP.x, miss.y = topY - 26;
      drawMyHud(meP.x, topY, t, dt, now);
    }
    for (const p of people) if (!p.me && p.o && p.o.e && p.a > 0) drawEmote(p.x, depthY(p.d) - 112 * depthS(p.d), p.o.e, t - p.o.eT);
    // 열차를 놓쳤을 때
    if (miss) {
      miss.t += dt;
      const a = Math.max(0, Math.min(1, (2800 - miss.t) / 600));
      g.globalAlpha = a; g.font = '700 12px "Gowun Dodum", sans-serif';
      const w = g.measureText(miss.text).width + 18;
      const mx = Math.min(W - w / 2 - 6, Math.max(w / 2 + 6, miss.x)), my = miss.y - miss.t * 0.01;
      g.fillStyle = "#c8372b"; roundRect(mx - w / 2, my - 11, w, 22, 11); g.fill();
      g.fillStyle = "#fff"; g.fillText(miss.text, mx, my + 0.5);
      g.globalAlpha = 1;
      if (miss.t > 2800) miss = null;
    }

    // 혼잡도 (바닥 왼쪽 아래, 실제 시각 기준)
    g.font = '700 11px "Gowun Dodum", sans-serif'; g.textAlign = "left"; g.textBaseline = "middle";
    const cLabel = tr.night ? "운행 종료 · 첫차 05:30" : crowdTitle(now);
    { const w = g.measureText(cLabel).width; const y = H - 104; g.fillStyle = "rgba(17,22,28,.62)"; roundRect(10, y, w + 20, 22, 11); g.fill(); g.fillStyle = crowdLevel(now) >= 0.85 && !tr.night ? "#ffb4a6" : "#fff"; g.fillText(cLabel, 20, y + 11.5); }
    drawNextChip(now);

    // 열차 상태 변화
    if (tr.phase !== prevPhase) {
      if (tr.phase === "close" && prevPhase === "open") {
        const wait = tr.after ? tr.after.e - now / 1000 : 0;
        const cost = comma(wait * hourly() / 3600);
        if (me.st === "queue" && me.q && me.q.id === tr.id) {
          miss = { t: 0, x: me.x * W, y: 300, text: `만원! 못 탔어요 · 다음 열차 ${waitText(wait)} = ${cost}원` };
        } else if (me.st === "wait" || me.st === "going") {
          me.st = "wait";
          miss = { t: 0, x: me.x * W, y: 300, text: `놓쳤다! 다음 열차 ${waitText(wait)} = ${cost}원` };
        }
      }
      if (tr.phase === "leave" && me.st === "in") { me.st = "ride"; rideT0 = t; }
      if (tr.phase === "gone" && me.st === "in") {
        me.st = "wait"; me.x = me.tx = 0.15 + Math.random() * 0.7; me.depth = Math.random(); sendPresence();
      }
      prevPhase = tr.phase;
    }
    if (room && (walking || t - lastSent > 5000) && t - lastSent > 120) { sendPresence(); lastSent = t; }
  }
  // 한 프레임에서 오류가 나도 화면이 멈추지 않게: 오류를 잠깐 보여 주고 다음 프레임은 계속 그린다
  let errShown = -1e9;
  function frame(t) {
    try { step(t); }
    catch (e) {
      console.error(e);
      fit(); // 캔버스 상태(변환·잘라내기)를 초기화
      if (t - errShown > 4000) { errShown = t; toast("화면 오류: " + String(e && e.message || e).slice(0, 80), 3500); }
    }
    requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('30px "Do Hyeon"', "내시간역주판퇴근행열차초후도착들어옵니다타세요출발합니다"), document.fonts.load('600 12px "Nanum Gothic Coding"', "0123456789")]).catch(() => {});
  }
  enterScene(curScene, performance.now());
  requestAnimationFrame(frame);

  // 최신 가격표 (같은 폴더에 있으면)
  fetch("prices.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(d => {
    if (!d || !Array.isArray(d.items)) return;
    const pick = { americano: "아메리카노", jjajang: "짜장면", chicken: "치킨", netflix: "넷플릭스 한 달", gift: "축의금", iphone: "아이폰 18 프로", sonata: "쏘나타", "seoul-apt": "서울 아파트" };
    const next = d.items.filter(x => pick[x.id] && x.price > 0).map(x => ({ name: pick[x.id], price: x.price }));
    if (next.length) ITEMS = next;
  }).catch(() => {});
})();
</script>
