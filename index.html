<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>내시간역</title>
<meta name="description" content="퇴근길 승강장에 서면 머리 위에 내 1분 가격이 떠요. 아메리카노행 27분, 서울 아파트행 63년 후 도착.">
<meta property="og:title" content="내시간역 — 내 1분은 얼마?">
<meta property="og:description" content="퇴근길 승강장에 같이 서 있어요. 머리 위엔 각자의 1분 가격.">
<meta name="theme-color" content="#11161c">
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=IBM+Plex+Mono:wght@600&family=IBM+Plex+Sans+KR:wght@500;700&display=swap">
<style>
/* 레이아웃: 한 화면 꽉 찬 승강장 캔버스(가상 360x640, 레터박스) + 아래 떠 있는 버튼 두 개. 서울 지하철 승강장(스크린도어·LED 안내판·녹색 역명판) */
:root {
  --night: #11161c;      /* 천장·레터박스 */
  --led: #ff9a2e;        /* LED 안내판 글자 */
  --tile: #dfe8e4;       /* 벽 타일 */
  --line: #2fa35a;       /* 역명판·열차 띠 */
  --floor: #a9adb0;      /* 승강장 바닥 */
  --ink: #1b2329;
  --chip: rgba(17, 22, 28, .86);
  --chip-ink: #f2f5f7;
  --go: #2fa35a;
  --display: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --body: "IBM Plex Sans KR", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, Consolas, monospace;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body {
  margin: 0; background: var(--night); color: var(--chip-ink);
  font-family: var(--body); overflow: hidden; touch-action: manipulation;
  -webkit-user-select: none; user-select: none;
}
.stage { position: fixed; inset: 0; display: flex; justify-content: center; }
canvas { display: block; height: 100%; max-width: 100%; cursor: pointer; }
.hud {
  position: fixed; left: 0; right: 0; bottom: 0;
  padding-bottom: calc(14px + env(safe-area-inset-bottom, 0px));
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: flex; justify-content: center; pointer-events: none;
}
.bar { width: 100%; max-width: 448px; display: flex; flex-direction: column; gap: 8px; }
.row { display: flex; gap: 8px; justify-content: space-between; align-items: center; }
.chip, .go {
  pointer-events: auto; border: 0; cursor: pointer;
  font: 700 15px/1 var(--body); border-radius: 999px; padding: 12px 16px;
}
.chip { background: var(--chip); color: var(--chip-ink); display: inline-flex; gap: 6px; align-items: baseline; }
.chip b { font: 600 16px var(--mono); color: var(--led); }
.go { background: var(--go); color: #fff; padding: 12px 22px; box-shadow: 0 6px 18px rgba(47,163,90,.45); }
.go[hidden] { display: none; }
.chip:focus-visible, .go:focus-visible, input:focus-visible { outline: 2px solid var(--led); outline-offset: 2px; }
.dial {
  pointer-events: auto; background: var(--chip); border-radius: 16px; padding: 12px 16px 10px;
  display: flex; flex-direction: column; gap: 4px;
}
.dial[hidden] { display: none; }
.dial .top { display: flex; justify-content: space-between; font-size: 13px; color: #b9c3cb; }
.dial .top b { font: 600 15px var(--mono); color: var(--chip-ink); }
input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 34px; background: transparent; margin: 0; }
input[type=range]::-webkit-slider-runnable-track { height: 4px; background: #4a5560; border-radius: 2px; }
input[type=range]::-moz-range-track { height: 4px; background: #4a5560; border-radius: 2px; }
input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 26px; height: 26px; margin-top: -11px; border-radius: 50%; background: var(--led); border: 3px solid var(--night); }
input[type=range]::-moz-range-thumb { width: 22px; height: 22px; border-radius: 50%; background: var(--led); border: 3px solid var(--night); }
.toast {
  position: fixed; left: 50%; top: calc(18% + env(safe-area-inset-top, 0px)); transform: translateX(-50%);
  background: var(--chip); color: var(--chip-ink); border-radius: 14px; padding: 12px 18px;
  font: 700 15px var(--body); text-align: center; pointer-events: none; opacity: 0; transition: opacity .3s;
  max-width: calc(100% - 32px);
}
.toast.on { opacity: 1; }
.toast b { color: var(--led); font-family: var(--mono); }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>

<div class="stage"><canvas id="cv" aria-label="퇴근길 지하철 승강장. 화면을 누르면 내 캐릭터가 그 자리로 걸어가요."></canvas></div>
<div class="toast" id="toast" role="status"></div>
<div class="hud">
  <div class="bar">
    <div class="dial" id="dial" hidden>
      <div class="top"><span>월급 (세전)</span><b id="payText">2,156,880원</b></div>
      <input type="range" id="pay" min="1000000" max="10000000" step="10000" value="2156880" aria-label="월급, 세금 떼기 전">
    </div>
    <div class="row">
      <button class="chip" id="me" type="button" aria-expanded="false" aria-controls="dial">내 1분 <b id="perMin">172원</b></button>
      <button class="go" id="board" type="button" hidden>타기</button>
    </div>
  </div>
</div>

<script>
(() => {
  // ---------- 숫자 ----------
  const MIN_WAGE = 10320, MONTH_H = 209, MIN_MONTH = MIN_WAGE * MONTH_H, DAY_H = 8;
  let ITEMS = [
    { name: "아메리카노", price: 4700 }, { name: "짜장면", price: 7808 }, { name: "치킨", price: 23000 },
    { name: "넷플릭스 한 달", price: 13500 }, { name: "축의금", price: 117000 }, { name: "아이폰 18 프로", price: 1990000 },
    { name: "쏘나타", price: 28760000 }, { name: "서울 아파트", price: 1639190000 }
  ];
  const KEY = "zoopan-station-v1";
  let pay = MIN_MONTH;
  let look = Math.floor(Math.random() * 6);
  try {
    const s = JSON.parse(localStorage.getItem(KEY) || "{}");
    if (s.pay >= 1000000 && s.pay <= 10000000) pay = s.pay;
    if (Number.isInteger(s.look)) look = s.look % 6;
  } catch (e) {}
  const save = () => { try { localStorage.setItem(KEY, JSON.stringify({ pay, look })); } catch (e) {} };
  save();
  const hourly = () => pay / MONTH_H;
  const perMin = () => Math.round(hourly() / 60);
  const comma = n => Math.round(n).toLocaleString("ko-KR");
  function dur(price) {
    const min = Math.round(price / hourly() * 60);
    if (min < 60) return Math.max(1, min) + "분";
    if (min < DAY_H * 60) { const h = Math.floor(min / 60), m = min % 60; return h + "시간" + (m ? " " + m + "분" : ""); }
    const mon = MONTH_H * 60;
    if (min < mon) { let d = Math.floor(min / (DAY_H * 60)), h = Math.round((min % (DAY_H * 60)) / 60); if (h >= DAY_H) { d++; h = 0; } return d + "일" + (h ? " " + h + "시간" : ""); }
    const months = min / mon;
    if (months < 12) return (Math.round(months * 10) / 10) + "개월";
    let y = Math.floor(months / 12), mo = Math.round(months % 12); if (mo === 12) { y++; mo = 0; }
    return y + "년" + (mo ? " " + mo + "개월" : "");
  }

  // ---------- 캔버스 ----------
  const W = 360;
  let H = 640; // 화면이 세로로 길면 승강장 바닥을 아래로 늘린다
  const cv = document.getElementById("cv"), g = cv.getContext("2d");
  let scale = 1;
  function fit() {
    const dpr = Math.min(window.devicePixelRatio || 1, 2);
    const vw = Math.min(window.innerWidth, 520), vh = window.innerHeight;
    H = Math.max(640, Math.min(900, Math.round(W * vh / vw)));
    scale = Math.min(vw / W, vh / H);
    const cw = Math.round(W * scale), ch = Math.round(H * scale);
    cv.style.width = cw + "px"; cv.style.height = ch + "px";
    cv.width = Math.round(cw * dpr); cv.height = Math.round(ch * dpr);
    g.setTransform(cv.width / W, 0, 0, cv.height / H, 0, 0);
  }
  addEventListener("resize", fit); fit();

  const C = { night: "#11161c", led: "#ff9a2e", tile: "#dfe8e4", tile2: "#d2ddd8", line: "#2fa35a", floor: "#a9adb0", floor2: "#9a9ea2", ink: "#1b2329" };
  const SKIN = ["#f1c9a5", "#e5b48a", "#c98e64", "#f6d6bb", "#d9a274", "#b97c55"];
  const SHIRT = ["#3b6fb6", "#d65a4a", "#4f8f5b", "#7a5bb0", "#e0a43a", "#2f3a46"];
  const HAIR = ["#1d1a17", "#3a2a1e", "#5b3a24", "#222", "#6b4a2f", "#141414"];

  // 열차 시간표: 모두의 시계로 같은 열차를 본다 (서버 없음)
  const CYCLE = 40, ARRIVE = 4, OPEN = 14, CLOSE = 16, LEAVE = 20;
  // 벽·열차·스크린도어는 K배로 줄여서 멀리 보이게 그린다 (그만큼 승강장 바닥이 넓어진다)
  const K = 0.64, BW = Math.round(W / K);          // 줄인 그림 안에서 쓰는 가로 폭
  const DOORS = [70, 180, 290, 400, 510];           // 줄인 그림 안 좌표
  const DOOR_SX = DOORS.map(d => d * K);            // 화면 좌표
  const PT = 86 + (426 - 86) * K;                   // 승강장 바닥이 시작하는 y
  function trainState(now) {
    const t = (now / 1000) % CYCLE;
    let x = null, door = 0, phase = "gone";
    if (t < ARRIVE) { const k = t / ARRIVE; x = BW * Math.pow(1 - k, 3); phase = "arrive"; }
    else if (t < OPEN) { x = 0; phase = "open"; door = Math.min(1, (t - ARRIVE) / 1.2); }
    else if (t < CLOSE) { x = 0; phase = "close"; door = Math.max(0, 1 - (t - OPEN) / 1.2); }
    else if (t < LEAVE) { const k = (t - CLOSE) / (LEAVE - CLOSE); x = -BW * k * k; phase = "leave"; }
    const next = Math.ceil(CYCLE - t);
    return { t, x, door, phase, next };
  }

  // ---------- 나와 다른 사람 ----------
  const me = { x: 0.3 + Math.random() * 0.4, tx: null, depth: Math.random(), st: "wait", walkT: 0 };
  me.tx = me.x;
  const others = new Map(); // peer -> {x, depth, p, look, st, dx}

  const FOOT_TOP = () => PT + 58, FOOT_RANGE = () => H - PT - 118;
  function depthY(d) { return FOOT_TOP() + d * FOOT_RANGE(); } // 발 위치 y (버튼 위까지)
  function depthS(d) { return 0.86 + d * 0.26; }    // 크기

  function drawPerson(x, d, lk, perMinVal, isMe, walking, now, alpha) {
    const y = depthY(d), s = depthS(d);
    const bob = walking ? Math.abs(Math.sin(now / 110)) * 2.2 : Math.sin(now / 700 + x) * 0.8;
    g.save(); g.globalAlpha = alpha; g.translate(x, y); g.scale(s, s);
    // 그림자
    g.fillStyle = "rgba(0,0,0,.18)"; g.beginPath(); g.ellipse(0, 0, 15, 4, 0, 0, Math.PI * 2); g.fill();
    // 다리
    const step = walking ? Math.sin(now / 110) * 4 : 0;
    g.strokeStyle = "#2a2f36"; g.lineWidth = 5; g.lineCap = "round";
    g.beginPath(); g.moveTo(-5, -20); g.lineTo(-5 + step, -2); g.moveTo(5, -20); g.lineTo(5 - step, -2); g.stroke();
    g.translate(0, -bob);
    // 몸통
    g.fillStyle = SHIRT[lk % 6];
    roundRect(-12, -50, 24, 32, 9); g.fill();
    // 사원증 줄
    g.strokeStyle = "rgba(255,255,255,.85)"; g.lineWidth = 1.4;
    g.beginPath(); g.moveTo(-6, -49); g.lineTo(0, -34); g.lineTo(6, -49); g.stroke();
    g.fillStyle = "#fff"; g.fillRect(-3.5, -35, 7, 9);
    g.fillStyle = C.line; g.fillRect(-3.5, -35, 7, 2.5);
    // 머리
    g.fillStyle = SKIN[(lk * 5 + 1) % 6]; g.beginPath(); g.arc(0, -62, 12, 0, Math.PI * 2); g.fill();
    g.fillStyle = HAIR[lk % 6]; g.beginPath(); g.arc(0, -64, 12.4, Math.PI * 1.05, Math.PI * 1.95); g.fill();
    g.fillRect(-12.2, -66, 3, 6);
    // 눈 (피곤한 반달)
    g.strokeStyle = "#222"; g.lineWidth = 1.6;
    g.beginPath(); g.arc(-4.5, -61, 2, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    g.beginPath(); g.arc(4.5, -61, 2, 0.15 * Math.PI, 0.85 * Math.PI); g.stroke();
    g.restore();
    // 가격표
    const label = "1분 " + comma(perMinVal) + "원";
    g.save(); g.globalAlpha = alpha;
    g.font = `600 ${11 * s}px "IBM Plex Mono", monospace`;
    const tw = g.measureText(label).width, tx = x - tw / 2 - 6 * s, ty = y - (88 + bob) * s;
    g.fillStyle = isMe ? C.led : "rgba(17,22,28,.82)";
    roundRect(tx, ty, tw + 12 * s, 17 * s, 8.5 * s); g.fill();
    g.fillStyle = isMe ? C.night : "#f2f5f7"; g.textBaseline = "middle"; g.textAlign = "center";
    g.fillText(label, x, ty + 8.8 * s);
    if (isMe) {
      g.fillStyle = C.led; g.beginPath(); g.moveTo(x - 4 * s, ty + 17 * s); g.lineTo(x + 4 * s, ty + 17 * s); g.lineTo(x, ty + 22 * s); g.fill();
    }
    g.restore();
  }
  function roundRect(x, y, w, h, r) {
    g.beginPath(); g.moveTo(x + r, y); g.arcTo(x + w, y, x + w, y + h, r); g.arcTo(x + w, y + h, x, y + h, r);
    g.arcTo(x, y + h, x, y, r); g.arcTo(x, y, x + w, y, r); g.closePath();
  }

  // ---------- 장면 ----------
  let ledOffset = 230; // 처음부터 글자가 보이게
  function ledText(tr) {
    const lines = ITEMS.map(it => `${it.name}행 ${dur(it.price)} 후 도착`);
    const head = tr.phase === "gone" ? `퇴근행 열차 ${tr.next}초 후 도착` : tr.phase === "arrive" ? "퇴근행 열차 들어옵니다" : tr.phase === "open" ? "퇴근행 열차 타세요" : "퇴근행 열차 출발합니다";
    return { head, scroll: lines.join("   ·   ") };
  }

  function drawScene(now, dt) {
    const tr = trainState(now);
    // 천장
    g.fillStyle = C.night; g.fillRect(0, 0, W, H);
    g.fillStyle = "#1c232b"; g.fillRect(0, 0, W, 86);
    g.fillStyle = "#f4f8ff"; for (let x = 30; x < W; x += 110) { g.globalAlpha = .9; g.fillRect(x, 78, 60, 4); } g.globalAlpha = 1;
    // LED 안내판
    g.fillStyle = "#050607"; roundRect(14, 16, W - 28, 56, 6); g.fill();
    g.strokeStyle = "#2a3139"; g.lineWidth = 2; g.stroke();
    const led = ledText(tr);
    g.fillStyle = C.led; g.font = '15px "Black Han Sans", sans-serif'; g.textBaseline = "middle"; g.textAlign = "left";
    g.fillText(led.head, 26, 34);
    g.save(); roundRect(20, 46, W - 40, 22, 2); g.clip();
    g.font = '600 12px "IBM Plex Mono", "IBM Plex Sans KR", monospace';
    const sw = g.measureText(led.scroll).width + 60;
    ledOffset = (ledOffset + dt * 0.045) % sw;
    g.fillStyle = "#ffb766";
    g.fillText(led.scroll, W - 20 - ledOffset, 57); g.fillText(led.scroll, W - 20 - ledOffset + sw, 57);
    g.restore();
    // 여기서부터 벽·선로·열차·스크린도어는 K배로 줄여 그린다
    g.save(); g.translate(0, 86); g.scale(K, K); g.translate(0, -86);
    // 벽 타일
    g.fillStyle = C.tile; g.fillRect(0, 86, BW, 300);
    g.strokeStyle = C.tile2; g.lineWidth = 1;
    for (let y = 86; y < 386; y += 14) { g.beginPath(); g.moveTo(0, y); g.lineTo(BW, y); g.stroke(); }
    for (let y = 86, r = 0; y < 386; y += 14, r++) for (let x = (r % 2) * 14; x < BW; x += 28) { g.beginPath(); g.moveTo(x, y); g.lineTo(x, y + 14); g.stroke(); }
    // 역명판 (가운데)
    g.save(); g.translate((BW - 360) / 2, 0);
    g.fillStyle = "#fff"; roundRect(40, 120, 280, 70, 8); g.fill();
    g.fillStyle = C.line; g.fillRect(40, 176, 280, 14);
    g.fillStyle = C.line; g.beginPath(); g.arc(78, 150, 18, 0, Math.PI * 2); g.fill();
    g.fillStyle = "#fff"; g.font = '13px "Black Han Sans", sans-serif'; g.textAlign = "center"; g.fillText("주판", 78, 151);
    g.fillStyle = C.ink; g.font = '30px "Black Han Sans", sans-serif'; g.textAlign = "left"; g.fillText("내시간역", 106, 146);
    g.font = '600 10px "IBM Plex Mono", monospace'; g.fillStyle = "#5c6770"; g.fillText("TIME-PRICE STATION", 108, 167);
    g.restore();
    // 선로
    g.fillStyle = "#2b2f33"; g.fillRect(0, 386, BW, 40);
    g.fillStyle = "#6c7176"; g.fillRect(0, 404, BW, 3); g.fillRect(0, 418, BW, 3);
    // 열차
    if (tr.x !== null) drawTrain(tr.x, tr.door, now);
    // 스크린도어
    drawPSD(tr.door);
    g.restore();
    drawDirSigns(now);
    // 승강장 바닥 (넓다)
    const fl = g.createLinearGradient(0, PT, 0, H); fl.addColorStop(0, C.floor); fl.addColorStop(1, C.floor2);
    g.fillStyle = fl; g.fillRect(0, PT, W, H - PT);
    g.fillStyle = "#e8c53a"; g.fillRect(0, PT + 10, W, 7);
    g.fillStyle = "rgba(0,0,0,.12)"; for (let x = 4; x < W; x += 8) g.fillRect(x, PT + 12, 3, 3);
    for (const dx of DOOR_SX) { g.fillStyle = "rgba(255,255,255,.55)"; g.fillRect(dx - 14, PT + 22, 3, 11); g.fillRect(dx + 11, PT + 22, 3, 11); }
    // 바닥 줄눈 (넓은 바닥에 깊이감)
    g.strokeStyle = "rgba(0,0,0,.06)"; g.lineWidth = 1;
    for (let y = PT + 50; y < H; y += 46) { g.beginPath(); g.moveTo(0, y); g.lineTo(W, y); g.stroke(); }
    return tr;
  }

  // ---------- 출근·퇴근 시계 (9시 출근, 점심 12~13시, 18시 퇴근, 주말 쉼) ----------
  const START_H = 9, END_H = 18;
  function nextWorkStart(now) {
    const d = new Date(now); d.setHours(START_H, 0, 0, 0);
    if (d.getTime() <= now) d.setDate(d.getDate() + 1);
    while (d.getDay() === 0 || d.getDay() === 6) d.setDate(d.getDate() + 1);
    return d.getTime();
  }
  function schedule(now) {
    const d = new Date(now), day = d.getDay();
    const s = new Date(now); s.setHours(START_H, 0, 0, 0);
    const e = new Date(now); e.setHours(END_H, 0, 0, 0);
    const l1 = new Date(now); l1.setHours(12, 0, 0, 0);
    const l2 = new Date(now); l2.setHours(13, 0, 0, 0);
    if (day === 0 || day === 6) return { mode: "weekend", toWork: nextWorkStart(now) - now };
    if (now < s.getTime()) return { mode: "before", toWork: s.getTime() - now };
    if (now >= e.getTime()) return { mode: "after", toWork: nextWorkStart(now) - now, sinceOff: now - e.getTime() };
    const lunch = Math.max(0, Math.min(now, l2.getTime()) - l1.getTime());
    const workedMs = now - s.getTime() - Math.min(lunch, 3600000);
    return { mode: now >= l1.getTime() && now < l2.getTime() ? "lunch" : "work", toOff: e.getTime() - now, workedMs };
  }
  const hms = ms => {
    let s = Math.max(0, Math.floor(ms / 1000)); const dd = Math.floor(s / 86400); s %= 86400;
    const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (dd ? dd + "일 " : "") + h + ":" + String(m).padStart(2, "0") + ":" + String(sec).padStart(2, "0");
  };

  function drawDirSigns(now) {
    const sc = schedule(now);
    const blink = Math.floor(now / 500) % 2 === 0;
    // 표지판: 위 = 역 이름(크게), 가운데 = 무엇까지, 아래 = 초 단위 시계
    const sign = (x, w, title, label, time, timeColor) => {
      g.fillStyle = "#1f6f3e"; roundRect(x, 98, w, 70, 8); g.fill();
      g.fillStyle = C.line; roundRect(x + 2, 100, w - 4, 28, 7); g.fill();
      g.textBaseline = "middle"; g.textAlign = "center";
      g.fillStyle = "#fff"; g.font = '18px "Black Han Sans", sans-serif'; g.fillText(title, x + w / 2, 115);
      g.fillStyle = "#bfe6cc"; g.font = '700 10px "IBM Plex Sans KR", sans-serif'; g.fillText(label, x + w / 2, 139);
      g.fillStyle = timeColor; g.font = `600 ${time.length > 9 ? 11 : 14}px "IBM Plex Mono", monospace`; g.fillText(time, x + w / 2, 156);
    };
    const calm = "#ffffff", hot = blink ? "#ffd2c8" : "#ff7a63";
    let L, R;
    if (sc.mode === "work" || sc.mode === "lunch") {
      L = ["출근한 지", hms(sc.workedMs), calm];
      R = ["퇴근까지", hms(sc.toOff), sc.toOff < 3600000 ? hot : "#ffe08a"];
    } else if (sc.mode === "after") {
      L = ["다음 출근까지", hms(sc.toWork), sc.toWork < 3 * 3600000 ? hot : calm];
      R = ["퇴근한 지", hms(sc.sinceOff), "#bff5cf"];
    } else {
      L = ["출근까지", hms(sc.toWork), sc.toWork < 3600000 ? hot : calm];
      R = [sc.mode === "weekend" ? "오늘은" : "아직", sc.mode === "weekend" ? "쉬는 날" : "출근 전", "#bff5cf"];
    }
    sign(4, 84, "◀ 출근역", L[0], L[1], L[2]);
    sign(W - 88, 84, "퇴근역 ▶", R[0], R[1], R[2]);
    return sc;
  }

  function drawTrain(x, door, now) {
    g.save(); g.translate(x, 0);
    g.fillStyle = "#e9edf0"; roundRect(-6, 214, BW + 40, 186, 14); g.fill();
    g.fillStyle = C.line; g.fillRect(-6, 330, BW + 46, 14);
    g.fillStyle = "#c9d0d5"; g.fillRect(-6, 386, BW + 46, 12);
    for (const dx of DOORS) {
      // 창
      g.fillStyle = "#2c3a44";
      roundRect(dx - 75 + 18, 236, 34, 58, 5); g.fill(); roundRect(dx + 75 - 52, 236, 34, 58, 5); g.fill();
      // 문
      const open = door * 15;
      g.fillStyle = "#1f2a31"; g.fillRect(dx - 15, 236, 30, 148);
      g.fillStyle = "#dfe4e8";
      g.fillRect(dx - 15 - open, 230, 15, 156); g.fillRect(dx + open, 230, 15, 156);
      g.fillStyle = "#2c3a44"; g.fillRect(dx - 12 - open, 240, 9, 40); g.fillRect(dx + 3 + open, 240, 9, 40);
    }
    g.restore();
  }

  function drawPSD(door) {
    // 스크린도어 위 가로대 + 유리
    g.fillStyle = "#3a434b"; g.fillRect(0, 222, BW, 12);
    g.fillStyle = "#79ff9c"; for (const dx of DOORS) { g.globalAlpha = door > 0 ? 1 : .25; g.fillRect(dx - 6, 226, 12, 4); }
    g.globalAlpha = 1;
    g.fillStyle = "rgba(170,205,220,.18)"; g.fillRect(0, 234, BW, 192);
    g.fillStyle = "#59636c";
    for (let x = 0; x <= BW; x += 55) g.fillRect(x - 1.5, 234, 3, 192);
    for (const dx of DOORS) {
      const open = door * 22;
      g.fillStyle = "#8a959d"; g.fillRect(dx - 24 - open, 234, 3, 192); g.fillRect(dx + 21 + open, 234, 3, 192);
      if (door > 0) { g.fillStyle = "rgba(0,0,0,.18)"; g.fillRect(dx - 21, 234, 42, 192); g.fillStyle = "rgba(170,205,220,.10)"; g.fillRect(dx - 24 - open, 234, open + 3, 192); g.fillRect(dx + 21, 234, open + 3, 192); }
    }
    g.fillStyle = "#59636c"; g.fillRect(0, 422, BW, 6);
  }

  // ---------- 실시간 ----------
  // claude.ai 미리보기에서는 room 기능, 공개판(github.io)에서는 우리 WebSocket 서버를 쓴다.
  const WS_HOST = "wss://time-price-station.seangold8888.workers.dev/station"; // Cloudflare Worker (worker/)
  const WS_URL = new URLSearchParams(location.search).get("ws") || WS_HOST;
  let room = null, alone = true, total = 0;

  // 우리 서버를 room과 같은 모양(presence/peers)으로 감싼다
  function wsRoom(url) {
    let ws = null, list = [], myId = "", listeners = [], mine = {}, retry = 1000, lastSent = "";
    // 바뀐 게 있을 때만 보낸다 (Cloudflare 무료 한도는 받은 메시지 수로 센다). 연결 유지는 30초마다 ping.
    setInterval(() => { if (ws && ws.readyState === 1) ws.send("ping"); }, 30000);
    const api = {
      presence(obj) {
        mine = obj;
        const s = JSON.stringify({ t: "me", ...obj });
        if (ws && ws.readyState === 1 && s !== lastSent) { ws.send(s); lastSent = s; }
        return Promise.resolve();
      },
      peers() { return list; },
      onPeers(fn) { listeners.push(fn); return () => {}; },
      onConnection() { return () => {}; }
    };
    function open() {
      try { ws = new WebSocket(url); } catch (e) { return; }
      ws.onopen = () => { retry = 1000; lastSent = ""; api.presence(mine); };
      ws.onmessage = ev => {
        if (ev.data === "pong") return;
        let m; try { m = JSON.parse(ev.data); } catch { return; }
        if (m.t === "hi") myId = m.id;
        if (m.t === "all" && Array.isArray(m.list)) {
          total = Number(m.n) || 0;
          list = m.list.filter(r => Array.isArray(r) && r[0] !== myId).map(r => ({
            peer: String(r[0]), sameTab: false, kind: "viewer",
            presence: { x: r[1], d: r[2], p: r[3], lk: r[4], st: r[5] ? "in" : "wait" }
          }));
          listeners.forEach(f => f());
        }
      };
      ws.onclose = () => { list = []; listeners.forEach(f => f()); setTimeout(open, retry); retry = Math.min(retry * 2, 30000); };
    }
    open();
    return api;
  }

  function sendPresence() {
    if (!room) return;
    room.presence({ x: +me.x.toFixed(3), d: +me.depth.toFixed(2), p: perMin(), lk: look, st: me.st === "in" ? "in" : "wait" }).catch(() => {});
  }
  function readPeers() {
    if (!room) return;
    const seen = new Set();
    for (const p of room.peers()) {
      if (p.sameTab || p.kind !== "viewer") continue;
      const q = p.presence || {};
      const x = Number(q.x), d = Number(q.d), pm = Number(q.p), lk = Number(q.lk);
      if (!(x >= 0 && x <= 1)) continue;
      seen.add(p.peer);
      const o = others.get(p.peer) || { dx: x };
      o.x = x; o.d = d >= 0 && d <= 1 ? d : 0.5; o.p = pm > 0 && pm < 1e6 ? pm : 172;
      o.lk = Number.isInteger(lk) ? Math.abs(lk) % 6 : 0; o.st = q.st === "in" ? "in" : "wait";
      others.set(p.peer, o);
    }
    for (const k of [...others.keys()]) if (!seen.has(k)) others.delete(k);
    alone = others.size === 0;
  }
  (async () => {
    try {
      if (window.claude?.use) room = await window.claude.use("room");
      if (!room && WS_URL) room = wsRoom(WS_URL);
      if (!room) return;
      room.onPeers(() => readPeers());
      room.onConnection(c => { if (c) sendPresence(); });
      sendPresence();
    } catch (e) { room = null; }
  })();

  // ---------- 조작 ----------
  const $ = id => document.getElementById(id);
  let toastTimer = 0;
  function toast(html, ms = 2600) { const t = $("toast"); t.innerHTML = html; t.classList.add("on"); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove("on"), ms); }

  cv.addEventListener("pointerdown", e => {
    if (me.st !== "wait") return;
    const r = cv.getBoundingClientRect();
    const vx = (e.clientX - r.left) / r.width * W, vy = (e.clientY - r.top) / r.height * H;
    if (vy < PT + 10) return; // 승강장 바닥만
    me.tx = Math.min(0.95, Math.max(0.05, vx / W));
    me.depth = Math.min(1, Math.max(0, (vy - FOOT_TOP()) / FOOT_RANGE()));
  });

  $("me").addEventListener("click", () => {
    const d = $("dial"); d.hidden = !d.hidden; $("me").setAttribute("aria-expanded", String(!d.hidden));
  });
  const slider = $("pay"); slider.value = pay;
  function syncPay() {
    $("perMin").textContent = comma(perMin()) + "원";
    $("payText").textContent = comma(pay) + "원" + (pay === MIN_MONTH ? " · 최저임금" : "");
  }
  slider.addEventListener("input", () => {
    pay = Number(slider.value); if (Math.abs(pay - MIN_MONTH) < 15000) pay = MIN_MONTH;
    syncPay(); sendPresence();
  });
  slider.addEventListener("change", save);
  syncPay();

  $("board").addEventListener("click", () => {
    if (me.st !== "wait") return;
    const px = me.x * W;
    const door = DOOR_SX.reduce((a, b) => Math.abs(b - px) < Math.abs(a - px) ? b : a);
    me.st = "going"; me.tx = door / W; me.depth = 0; $("board").hidden = true;
  });

  // ---------- 반복 ----------
  let last = performance.now(), lastSent = 0, prevPhase = "";
  let coins = [], lastCoinSec = 0, miss = null;
  function frame(t) {
    const dt = Math.min(64, t - last); last = t;
    const now = Date.now();
    const tr = drawScene(now, dt);

    // 내 걸음
    const spd = 0.00022 * dt;
    let walking = false;
    if (Math.abs(me.tx - me.x) > 0.003) { me.x += Math.sign(me.tx - me.x) * Math.min(spd, Math.abs(me.tx - me.x)); walking = true; }
    if (me.st === "going" && !walking) {
      if (tr.phase === "open") { me.st = "in"; me.walkT = 0; sendPresence(); }
      else { me.st = "wait"; }
    }
    if (me.st === "in") me.walkT = Math.min(1, me.walkT + dt / 400);

    // 다른 사람: 부드럽게 따라가기
    const people = [];
    for (const o of others.values()) {
      o.dx += (o.x - o.dx) * Math.min(1, dt / 250);
      if (o.st === "in" && (tr.phase === "leave" || tr.phase === "gone")) continue;
      people.push({ x: o.dx * W, d: o.d, lk: o.lk, p: o.p, me: false, walk: Math.abs(o.x - o.dx) > 0.004, a: o.st === "in" ? 0.0 : 1 });
    }
    if (!(me.st === "in" && me.walkT >= 1)) people.push({ x: me.x * W, d: me.depth, lk: look, p: perMin(), me: true, walk: walking, a: me.st === "in" ? 1 - me.walkT : 1 });
    people.sort((a, b) => a.d - b.d);
    for (const p of people) if (p.a > 0) drawPerson(p.x, p.d, p.lk, p.p, p.me, p.walk, t, p.a);

    // 내 머리 위: 오늘 번 돈이 1초마다 오른다 (근무 시간에만)
    const sc = schedule(now);
    const perSec = hourly() / 3600;
    const meP = people.find(p => p.me);
    if (meP && meP.a > 0) {
      const s = depthS(meP.d), topY = depthY(meP.d) - 112 * s;
      if (sc.mode === "work" || sc.mode === "lunch") {
        const earned = sc.workedMs / 3600000 * hourly();
        const txt = "오늘 " + comma(earned) + "원";
        g.font = `700 ${11 * s}px "IBM Plex Sans KR", sans-serif`; g.textAlign = "center"; g.textBaseline = "middle";
        const w = g.measureText(txt).width + 14 * s;
        g.fillStyle = "rgba(255,224,138,.95)"; roundRect(meP.x - w / 2, topY, w, 17 * s, 8.5 * s); g.fill();
        g.fillStyle = C.night; g.fillText(txt, meP.x, topY + 8.8 * s);
        const sec = Math.floor(now / 1000);
        if (sc.mode === "work" && sec !== lastCoinSec) {
          lastCoinSec = sec;
          coins.push({ x: meP.x + (Math.random() * 24 - 12), y: topY - 4, t: 0 });
        }
      }
      if (miss) miss.x = meP.x, miss.y = topY - 26;
    }
    // 튀어 오르는 "+2.9원"
    const coinTxt = "+" + (perSec < 10 ? perSec.toFixed(1) : comma(perSec)) + "원";
    g.font = '600 11px "IBM Plex Mono", monospace'; g.textAlign = "center";
    for (const c of coins) { c.t += dt; c.y -= dt * 0.028; g.globalAlpha = Math.max(0, 1 - c.t / 1100); g.fillStyle = "#ffcf3f"; g.fillText(coinTxt, c.x, c.y); }
    g.globalAlpha = 1;
    while (coins.length && coins[0].t > 1100) coins.shift();
    // 열차를 놓쳤을 때
    if (miss) {
      miss.t += dt;
      const a = Math.max(0, Math.min(1, (2800 - miss.t) / 600));
      g.globalAlpha = a; g.font = '700 12px "IBM Plex Sans KR", sans-serif';
      const w = g.measureText(miss.text).width + 18;
      const mx = Math.min(W - w / 2 - 6, Math.max(w / 2 + 6, miss.x)), my = miss.y - miss.t * 0.01;
      g.fillStyle = "#c8372b"; roundRect(mx - w / 2, my - 11, w, 22, 11); g.fill();
      g.fillStyle = "#fff"; g.fillText(miss.text, mx, my + 0.5);
      g.globalAlpha = 1;
      if (miss.t > 2800) miss = null;
    }

    // 접속 인원 (바닥 왼쪽 위)
    const n = others.size + 1;
    g.font = '700 11px "IBM Plex Sans KR", sans-serif'; g.textAlign = "left"; g.textBaseline = "middle";
    const label = room ? (n === 1 ? "지금 승강장에 나 혼자" : `지금 승강장 ${n}명`) : "";
    if (label) { const w = g.measureText(label).width; g.fillStyle = "rgba(17,22,28,.62)"; roundRect(10, PT + 38, w + 20, 22, 11); g.fill(); g.fillStyle = "#fff"; g.fillText(label, 20, PT + 49.5); }

    // 열차 상태 변화
    if (tr.phase !== prevPhase) {
      if (tr.phase === "open" && me.st === "wait") $("board").hidden = false;
      if (tr.phase === "close") {
        $("board").hidden = true;
        if (me.st === "going") me.st = "wait";
        if (me.st === "wait" && prevPhase === "open") {
          const waitSec = CYCLE - CLOSE + ARRIVE; // 다음 열차 문 열릴 때까지
          miss = { t: 0, x: me.x * W, y: 300, text: `놓쳤다! 다음 열차까지 ${waitSec}초 = ${comma(waitSec * hourly() / 3600)}원` };
        }
      }
      if (tr.phase === "leave" && me.st === "in") {
        const earned = DAY_H * hourly();
        toast(`퇴근 완료!<br>오늘 <b>${comma(earned)}원</b> 벌었어요`, 3200);
      }
      if (tr.phase === "gone" && me.st === "in") {
        me.st = "wait"; me.x = me.tx = 0.15 + Math.random() * 0.7; me.depth = Math.random(); sendPresence();
      }
      prevPhase = tr.phase;
    }
    if (room && (walking || t - lastSent > 5000) && t - lastSent > 120) { sendPresence(); lastSent = t; }
    requestAnimationFrame(frame);
  }
  if (document.fonts && document.fonts.load) {
    Promise.all([document.fonts.load('30px "Black Han Sans"', "내시간역주판퇴근행열차초후도착들어옵니다타세요출발합니다"), document.fonts.load('600 12px "IBM Plex Mono"', "0123456789")]).catch(() => {});
  }
  requestAnimationFrame(frame);

  // 최신 가격표 (같은 폴더에 있으면)
  fetch("prices.json", { cache: "no-cache" }).then(r => r.ok ? r.json() : null).then(d => {
    if (!d || !Array.isArray(d.items)) return;
    const pick = { americano: "아메리카노", jjajang: "짜장면", chicken: "치킨", netflix: "넷플릭스 한 달", gift: "축의금", iphone: "아이폰 18 프로", sonata: "쏘나타", "seoul-apt": "서울 아파트" };
    const next = d.items.filter(x => pick[x.id] && x.price > 0).map(x => ({ name: pick[x.id], price: x.price }));
    if (next.length) ITEMS = next;
  }).catch(() => {});
})();
</script>
